# 高中 · 10-12 年级
#
# 高中最重要的转变：承认"看不见的东西"存在。
# 场、势、熵、概率波都看不见，但它们比看得见的现象更稳定、更好用。
# 另一个转变：学会用守恒与对称性，在不求解细节的情况下得到结论。

stage_id: high

units:
  # ================================================================ 数学
  - subject_id: math
    why: >
      高中数学从“算”转向“研究函数与结构”。导数与积分是同一件事的两个方向，
      它们让“变化的快慢”和“变化的累积”第一次可以被计算。

    points:
      - id: hi-math-01
        title: 集合与逻辑
        grade: 高一
        core: true
        strand: structure
        kid: 把一类东西装进一个筐里，就叫一个集合。是不是筐里的成员，只能回答是或不是。
        principle: >
          集合是“归属关系”的形式化，全称与存在量词是它的语言。
          否定一个全称命题得到的是存在命题，这是最常见的逻辑错误来源。
        model: 把“所有”和“存在”分清，才能正确地说清一个结论的适用范围。
        exit: 能写出“所有 A 都是 B”的否定，并说明为什么不是“所有 A 都不是 B”。
        video:
          q: [高一 数学 集合 充要条件 全称量词 存在量词]
          c: [smartedu, khan-math]

      - id: hi-math-02
        title: 函数与基本初等函数
        grade: 高一
        core: true
        strand: change
        kid: 函数是一台机器，进去一个数，出来一个数。指数是“翻倍”，对数是“翻几次才到”。
        principle: >
          幂、指数、对数、三角是四类基本增长方式。
          指数与对数互为逆运算——逆运算的意义是把“求结果”换成“求原因”。
        model: 逆运算让不可直接测量的量变得可测量（知道结果反推参数），是一切反演的雏形。
        exit: 能说出指数增长与线性增长在长距离上的差别，并解释对数刻度为什么适合跨数量级。
        video:
          q: [高一 数学 指数函数 对数函数 图像性质, logarithms explained]
          c: [smartedu, 3b1b]

      - id: hi-math-03
        title: 三角函数与周期
        grade: 高一
        core: true
        strand: change
        kid: 圆上有个小点在转圈，它的高度随时间一上一下，这个上下的规律就是三角函数。
        principle: >
          三角函数描述“圆周运动的投影”。一切周期现象都可以拆成三角函数之和，
          因为重复的形状可以被正弦波拼出来。
        model: 把复杂信号拆成简单振荡的叠加，是频域思维的起点，也是视频与音频处理的底座。
        exit: 能画出正弦函数图像并说出振幅、周期、相位各改变图像的哪一部分。
        video:
          q: [高一 数学 三角函数 图像 周期 相位, sine wave intuition]
          c: [smartedu, 3b1b]

      - id: hi-math-04
        title: 数列与极限的直觉
        grade: 高二
        core: true
        strand: scale
        kid: 一串有规律的数字叫数列。无限加下去有时会停在一个数附近，有时不会。
        principle: >
          极限不是“到达”，是“要多近有多近”。等差是加法增长，等比是乘法增长，
          两者长期行为的差别是量级差别，不是程度差别。
        model: 区分“趋近”与“等于”，是理解连续性与收敛的第一步。
        exit: 能判断一个等比数列的和是否收敛，并说明理由。
        video:
          q: [高二 数学 数列 等比数列求和 极限思想, converging series intuition]
          c: [smartedu, 3b1b]

      - id: hi-math-05
        title: 向量与空间坐标
        grade: 高一
        core: true
        strand: structure
        kid: 向量是一支带方向的箭头。箭头可以搬来搬去，只要长度和方向不变，就是同一个向量。
        principle: >
          向量把“方向”这个几何概念变成可加减的对象。
          点积衡量“两个方向有多一致”，叉积衡量“两个方向撑开多大面积”。
        model: 状态、动作、梯度都是向量。把物理量写成向量，才谈得上用线性代数处理它。
        exit: 能算两个向量的点积并说出它为零时几何上意味着什么。
        video:
          q: [高一 数学 向量 数量积 坐标运算, vectors dot product intuition]
          c: [smartedu, 3b1b]

      - id: hi-math-06
        title: 导数与变化率
        grade: 高二
        core: true
        strand: change
        kid: 速度是位置的变化快慢。导数就是“变化快慢”这件事本身。
        principle: >
          导数是局部线性化：在极小的范围内，任何光滑曲线看起来都像直线。
          因为局部像直线，才能用简单的式子逼近复杂的现实。
        model: 局部线性化是全部梯度方法的根。能在一小块区域内用线性近似，才谈得上优化。
        exit: 能求常见函数的导数，并解释为什么导数为零的点未必是极值点。
        video:
          q: [高二 数学 导数 几何意义 极值, derivative intuition 3blue1brown]
          c: [smartedu, 3b1b]

      - id: hi-math-07
        title: 积分与累积
        grade: 高二
        core: true
        strand: change
        kid: 把很多很窄的小长条加起来，就能算出不规则的面积。
        principle: >
          积分是“把无穷多个极小部分加起来”。它和导数互为逆运算——
          累积起来的变化率能还原总量，这是微积分基本定理。
        model: 累积与瞬时是一对对偶操作。搞清对偶关系，很多公式就不必死记。
        exit: 能用矩形逼近说明积分与导数的互逆关系，并算出一个简单曲边梯形面积。
        video:
          q: [高二 数学 定积分 微积分基本定理, integration intuition]
          c: [smartedu, 3b1b]

      - id: hi-math-08
        title: 概率与随机变量
        grade: 高二
        core: true
        strand: cause
        kid: 抛硬币的结果不确定，但抛很多次以后，各面出现的比例是稳定的。
        principle: >
          随机变量把“结果”变成“数”，于是可以对它求平均、求方差。
          期望是长期平均，不是“最可能发生的那一个”。
        model: 期望值不等于典型样本。用期望做预测时，要问分布是尖的还是宽的。
        exit: 能算出一个随机变量的期望与方差，并说出它和某个具体结果的关系。
        video:
          q: [高二 数学 随机变量 期望 方差 分布列, expected value intuition]
          c: [smartedu, khan-math]

      - id: hi-math-09
        title: 计数与排列组合
        grade: 高二
        core: true
        strand: number
        kid: 数东西不一定要一个一个数。分几步做，每步有几种选法，乘起来就是总数。
        principle: >
          计数靠的是“分步”与“分类”两个动作：分步相乘，分类相加。
          所有排列组合题目都在做的一件事是把问题拆成这两步。
        model: 组合爆炸的规模感必须亲手算过，否则无法判断一个算法是否可行。
        exit: 能算出一个 10 位数密码的所有可能数，并用它说明为什么暴力搜索不可行。
        video:
          q: [高二 数学 排列组合 计数原理 方法, counting principles permutations]
          c: [smartedu, khan-math, oeis]

      - id: hi-math-10
        title: 立体几何与空间想象
        grade: 高一
        core: false
        strand: structure
        kid: 纸上的图是平的，但它画的是一个能转着看的东西。要练习在脑子里把它转起来。
        principle: >
          三维问题用向量与坐标处理，可以绕开对图形旋转的直觉依赖。
          能用坐标算出来的东西，就不要靠图形直觉赌。
        model: 用代数替代几何直觉，是处理高维世界唯一可行的路线。世界模型的状态就是高维的。
        exit: 能用向量法求出两个平面的夹角，并说明图形直觉在哪一步最容易出错。
        video:
          q: [高一 数学 空间向量 立体几何 夹角]
          c: [smartedu]

  # ================================================================ 物理
  - subject_id: physics
    why: >
      高中物理只有两个重心：牛顿的“力改变运动”，以及守恒律。
      前者能解释一切细节，后者能跳过细节直接得结论。学得快的人靠后者。

    points:
      - id: hi-phy-01
        title: 运动学
        grade: 高一
        core: true
        strand: change
        kid: 速度是在变快的快慢，加速度是速度在变快的快慢。
        principle: >
          位移、速度、加速度是逐层求变化率的关系，反过来是逐层累积。
          图像下方的面积就是累积量——这是不背公式也能算的通用办法。
        model: 状态与其导数构成完整描述。世界模型要预测的正是状态的逐层演化。
        exit: 能从一个速度图像读出加速度、位移与某一时刻的位置。
        video:
          q: [高一 物理 匀变速直线运动 图像 面积, kinematics graphs]
          c: [smartedu, phet]

      - id: hi-phy-02
        title: 牛顿定律与受力分析
        grade: 高一
        core: true
        strand: energy
        kid: 用力越大，东西动得越快；东西越重，越难推动。
        principle: >
          加速度与合力成正比、与质量成反比，这是动力学的唯一方程。
          难点从不在方程，在“分出研究对象的边界”——把谁和谁分开看。
        model: 先定边界再定关系，是任何系统建模的第一步决策。
        exit: 能给包含斜面和滑轮的连接体问题画出各自的受力图并写出方程。
        video:
          q: [高一 物理 牛顿第二定律 受力分析 连接体]
          c: [smartedu, phet]

      - id: hi-phy-03
        title: 动量守恒
        grade: 高二
        core: true
        strand: change
        kid: 碰车的时候，两辆车动量的账加起来不变，即使撞得乱七八糟。
        principle: >
          合外力为零时总动量守恒，因为内力成对抵消。
          动量守恒在多数碰撞里都成立，即使机械能损失了很多。
        model: 找不变量的能力，等于在混乱中找到一个可用的坐标。不变量越多，问题越好解。
        exit: 能用动量守恒算出碰撞后的速度，并说明这里的能量去哪了。
        video:
          q: [高二 物理 动量守恒 碰撞 弹性与非弹性, conservation of momentum]
          c: [smartedu, phet]

      - id: hi-phy-04
        title: 能量守恒与机械能
        grade: 高一
        core: true
        strand: energy
        kid: 站在高处的小球，滑下来会越来越快；它“存着”的高度变成了速度。
        principle: >
          能量可以换形式但总量不变。做功是能量转移的账目，
          摩擦力做的功没有消失，变成了热。
        model: 守恒律是核验任何模型的第一把尺子。违反守恒的预测一定错在某处。
        exit: 能用能量守恒算出一段有摩擦的轨道上物体的末速度。
        video:
          q: [高一 物理 机械能守恒 动能定理 功能关系]
          c: [smartedu, phet]

      - id: hi-phy-05
        title: 圆周运动与万有引力
        grade: 高一
        core: true
        strand: scale
        kid: 甩绳子时手要一直拉着，不然石头就飞出去了。天上的月亮也是这样被地球拉着。
        principle: >
          圆周运动需要指向圆心的合力。把这条用到天体上，
          就会发现行星运动与地球上落体遵循同一条定律——这是物理学第一次大统一。
        model: “看似无关的现象服从同一定律”是理论进步最强烈的信号。
        exit: 能用万有引力算出第一宇宙速度，并说出它为什么与卫星质量无关。
        video:
          q: [高一 物理 向心力 万有引力 宇宙速度, circular motion gravity]
          c: [smartedu, phet]

      - id: hi-phy-06
        title: 电场与电势
        grade: 高二
        core: true
        strand: energy
        kid: 电荷会互相推，不用碰到也能推。电场就是“推这个作用”的传递者。
        principle: >
          场是对“超距作用”的替代解释：电荷先在周围产生场，场再对另一个电荷施力。
          电势是从能量角度看场，比较两个位置只需要看电势差。
        model: 引入中间量（场）来描述直接作用说不清的现象，是构造理论的标准手法。
        exit: 能解释为什么“电势为零的地方场强可以不为零”。
        video:
          q: [高二 物理 电场强度 电势 电势差 等势面]
          c: [smartedu, phet]

      - id: hi-phy-07
        title: 磁场与电磁感应
        grade: 高二
        core: true
        strand: energy
        kid: 电会生磁，磁动了又会生电。发电机和电动机就是这两句话的两个方向。
        principle: >
          变化的磁通量产生电动势，方向总在阻碍变化本身——这是楞次定律。
          阻碍变化这件事说明：系统倾向于反抗对它的改变。
        model: 负反馈是稳定性的来源，也是“改变需要持续做功”的原因。
        exit: 能判断导体在磁场中运动时感应电流的方向，并说明能量从哪来。
        video:
          q: [高二 物理 楞次定律 法拉第电磁感应 右手定则]
          c: [smartedu, phet]

      - id: hi-phy-08
        title: 波动与干涉
        grade: 高二
        core: true
        strand: change
        kid: 两个波碰到一起，高的地方会更高，有的地方会互相抵消，变成平的。
        principle: >
          波满足叠加原理，因为描述波的方程是线性的。
          干涉与衍射是“波”这个身份的判决性证据——粒子做不到这件事。
        model: 线性叠加让复杂输入可以拆开分析，这是全部信号处理的合法性来源。
        exit: 能用双缝实验说明为什么“光是一种波”曾经是必然结论。
        video:
          q: [高二 物理 波的干涉 衍射 双缝干涉, wave interference]
          c: [smartedu, phet]

      - id: hi-phy-09
        title: 热力学与熵
        grade: 高二
        core: true
        strand: energy
        kid: 热水会自己变凉，凉水不会自己变热。世界好像总往一个方向走，回不去。
        principle: >
          第二定律说的是：孤立系统的无序程度不会自己减少。
          它给出了时间的箭头——几乎一切物理定律都允许倒放，只有这一条不允许。
        model: “不可逆”是所有真实系统的基本约束。模型可以倒放，世界不能。
        exit: 能解释为什么效率百分之百的热机不存在，与“技术不够好”无关。
        video:
          q: [高二 物理 热力学第二定律 熵 不可逆性, entropy and arrow of time]
          c: [smartedu, phet, feynman]

  # ================================================================ 化学
  - subject_id: chemistry
    why: >
      高中化学从“记住反应”变成了“理解为什么这样反应”。
      驱动力是能量更低、更无序；速率是另一回事，两者必须分开谈。

    points:
      - id: hi-che-01
        title: 原子结构与元素周期律
        grade: 高一
        core: true
        strand: structure
        kid: 原子里有电子绕着中心转，外圈电子的数量决定了它的脾气。
        principle: >
          元素性质随原子序数周期性变化，因为外层电子的排布在周期性重复。
          周期表的形状不是人为编的，是从量子力学推出来的。
        model: 表的结构本身携带规律。会读表的人不需要背每一格。
        exit: 能根据元素在周期表的位置预测它的主要化合价与金属性强弱。
        video:
          q: [高一 化学 原子结构 元素周期律 周期表]
          c: [smartedu, phet]

      - id: hi-che-02
        title: 化学键
        grade: 高一
        core: true
        strand: structure
        kid: 有的原子把电子借给对方一部分（离子键），有的两个原子抢着共用（共价键）。
        principle: >
          键的性质由电子如何分配决定。键的极性累积起来就变成分子的极性，
          分子极性决定了物质之间能不能相溶。
        model: 从局部交互规则推出宏观性质，是化学的普遍推理方式。
        exit: 能解释为什么油不溶于水，并说出这与分子极性有什么关系。
        video:
          q: [高一 化学 离子键 共价键 分子极性]
          c: [smartedu, phet]

      - id: hi-che-03
        title: 反应速率与化学平衡
        grade: 高二
        core: true
        strand: change
        kid: 反应有快有慢。快不等于能做完，有些反应走到一半就不再变了，其实两边还在互相变。
        principle: >
          平衡是正逆速率相等的动态状态，不是反应停止。
          改变条件会移动平衡位置，但不会改变平衡常数的定义。
        model: 动态平衡与反馈是同一个概念在两个学科里的名字。
        exit: 能判断改变温度或压强时平衡往哪边移动，并说明依据。
        video:
          q: [高二 化学 化学反应速率 化学平衡 勒夏特列原理]
          c: [smartedu, phet]

      - id: hi-che-04
        title: 氧化还原与电化学
        grade: 高一
        core: true
        strand: energy
        kid: 有的原子把电子送出去，有的收进来。把这件事分开做，就是电池。
        principle: >
          氧化是失电子，还原是得电子，两者必须同时发生。
          把氧化与还原分置在两个电极上，就能把化学能取出来做成电流。
        model: 把同时发生的两个过程分离，从而利用它们的势差，是能量工程的核心手法。
        exit: 能写出一节电池的正负极反应，并说明电子在外部电路怎么走。
        video:
          q: [高一 化学 氧化还原反应 原电池 电解池]
          c: [smartedu, phet]

      - id: hi-che-05
        title: 有机物与碳骨架
        grade: 高二
        core: true
        strand: structure
        kid: 碳原子能跟别的碳手拉手，接成链子和圈，所以有无数种东西可以搭出来。
        principle: >
          碳的四个键让分子骨架可以任意分叉与成环，于是少数元素组合出巨大种类。
          官能团决定性质，骨架决定形状。
        model: 组合爆炸来自“允许连接”这件事本身。这是复杂度从简单规则里长出来的范例。
        exit: 能在给定分子式下写出两种不同结构，并说出它们的性质差异。
        video:
          q: [高二 化学 有机物 碳骨架 官能团 同分异构]
          c: [smartedu]

      - id: hi-che-06
        title: 反应热与焓
        grade: 高二
        core: false
        strand: energy
        kid: 反应前后能量差一点，这一点会以热的形式进出。
        principle: >
          焓变只取决于始终状态，与走哪条路径无关。
          因为与路径无关，才能把反应拆开算——这是盖斯定律的全部理由。
        model: 状态量可以任意拆路径计算，路径量不行。区分这两类是热力学与优化的入门。
        exit: 能利用两个已知反应的热效应算出第三个反应的热效应，并说明为什么可以相加。
        video:
          q: [高二 化学 反应热 焓变 盖斯定律]
          c: [smartedu]

  # ================================================================ 生物
  - subject_id: biology
    why: >
      高中生物把生命解释成“信息流加能量流”。
      中心法则管信息怎么走，代谢管能量怎么转，两者共同解释为什么活着必须持续消耗。

    points:
      - id: hi-bio-01
        title: 中心法则
        grade: 高一
        core: true
        strand: symbol
        kid: DNA 是总图纸，抄一份带出去叫 RNA，再照它把零件拼起来。
        principle: >
          信息从 DNA 到 RNA 到蛋白质，方向不可逆（转录与翻译没有反向常规通道）。
          它是“哪一步出错会影响什么”的判断依据。
        model: 单向信息流决定了系统的哪些错误可以掩盖、哪些一定会扩散。
        exit: 能说出基因突变在不同环节发生会分别导致什么后果。
        video:
          q: [高一 生物 中心法则 转录 翻译]
          c: [smartedu, khan-science]

      - id: hi-bio-02
        title: 细胞代谢
        grade: 高一
        core: true
        strand: energy
        kid: 光合作用把太阳的钱存进账户，呼吸作用把存款取出来花掉。
        principle: >
          光合与呼吸方向相反，一个存能一个放能，共同构成生物圈的能量循环。
          酶的作用是降低启动门槛，不改变方向也不改变终点。
        model: 催化剂改变速率、不改变平衡位置。分清“多快”和“能不能”，是动力学与热力学的分界。
        exit: 能说出提高温度时光合速率与呼吸速率各自怎么变，并解释上限在哪。
        video:
          q: [高一 生物 光合作用 呼吸作用 酶]
          c: [smartedu, khan-science]

      - id: hi-bio-03
        title: 遗传规律
        grade: 高一
        core: true
        strand: cause
        kid: 爸爸给一半，妈妈给一半，所以有的特征会隔代出现。
        principle: >
          分离与自由组合规律说的是概率分布，不是“必然出现”。
          数量少时偏离比例是正常现象，这正是需要统计检验的原因。
        model: 小样本偏离理论比例不构成反例。区分“随机波动”与“机制不同”需要样本量。
        exit: 能用棋盘法算出后代基因型比例，并说出为什么实际观察值会与理论有偏差。
        video:
          q: [高一 生物 孟德尔遗传定律 分离 自由组合]
          c: [smartedu, khan-science]

      - id: hi-bio-04
        title: 稳态与调节
        grade: 高二
        core: true
        strand: system
        kid: 身体想让体温、血糖都保持在一个小范围里，高了就压下去，低了就拉上来。
        principle: >
          稳态靠负反馈维持：偏离被检测到，就被反向纠正。
          激素是慢而广的信号，神经是快而准的信号，两套系统分工不同。
        model: 负反馈是稳定性的通用机制，也是控制系统设计的核心概念。
        exit: 能画出血糖升高的负反馈回路，并指出哪个环节坏了会变成糖尿病。
        video:
          q: [高二 生物 内环境稳态 负反馈 血糖调节]
          c: [smartedu, khan-science]

      - id: hi-bio-05
        title: 生态与进化
        grade: 高二
        core: true
        strand: system
        kid: 一个地方能养活多少生物是有限的，太多了就会有一部分活不下去。
        principle: >
          环境容纳量决定种群上限，种群增长受密度制约。
          进化是种群层面的变化，不是个体在努力适应。
        model: 区分“个体层面”与“群体层面”的机制，能避免很多直觉性错误。
        exit: 能画出一个种群在接近环境容纳量时的增长曲线，并说明为什么是 S 形。
        video:
          q: [高二 生物 种群增长 环境容纳量 进化]
          c: [smartedu, khan-science]

  # ================================================================ 地理
  - subject_id: geography
    why: >
      高中地理用物理与系统论解释地表：热量怎么分配、水怎么走、地形怎么被时间塑造。

    points:
      - id: hi-geo-01
        title: 地球运动与季节
        grade: 高一
        core: true
        strand: scale
        kid: 地球是歪着转的，所以太阳照到的地方一会儿多一会儿少，就有了四季。
        principle: >
          季节来自地轴倾角，不是来自地球与太阳的距离远近。
          黄赤交角决定了太阳直射点的南北移动，进而决定昼夜长短与热量分配。
        model: 一个固定的几何参数（倾角）支配了一整套周期性现象。参数决定结构，不是细节决定结构。
        exit: 能解释为什么南半球夏天在十二月，并说出极昼出现的条件。
        video:
          q: [高一 地理 地球运动 黄赤交角 太阳直射点 季节]
          c: [smartedu]

      - id: hi-geo-02
        title: 洋流与气候系统
        grade: 高一
        core: true
        strand: system
        kid: 海里有几条很大的水流，把热的水带到冷的地方，沿岸的气候就跟着变。
        principle: >
          洋流同时搬运热量与营养盐，所以它既影响气温又影响渔业。
          系统里的搬运量往往比局部状态更能解释差异。
        model: 关注“通量”而不只是“存量”，是理解开放系统的关键。
        exit: 能解释为什么同纬度的大陆东岸与西岸气候可能完全不同。
        video:
          q: [高一 地理 洋流 分布 对气候的影响]
          c: [smartedu]

      - id: hi-geo-03
        title: 地质循环与地貌
        grade: 高一
        core: false
        strand: change
        kid: 石头会被水冲、被风磨、被挤压，几百万年后变成另一种样子。
        principle: >
          岩石圈有完整的循环：岩浆岩、沉积岩、变质岩互相转化。
          内力造出高差，外力削平高差——两个方向对抗形成地形。
        model: 对抗过程的长期平衡决定系统的形态，短期观察容易得出相反结论。
        exit: 能解释为什么高山的地形起伏长期看并没有无限增高。
        video:
          q: [高一 地理 地壳物质循环 内外力作用 地貌]
          c: [smartedu]

      - id: hi-geo-04
        title: 区域差异与全球化
        grade: 高二
        core: false
        strand: system
        kid: 不同地方有的产粮有的产矿，互相买卖，谁都能过得更好一点。
        principle: >
          区域分工建立在资源禀赋与比较优势上。
          要素流动会削弱差异，但制度与规模效应会重新制造差异。
        model: 差异既是交易的原因，也会被交易改变。判断方向要看两个效应谁更强。
        exit: 能举出一个产业转移的例子，并说出输出地与承接地各得到什么与失去什么。
        video:
          q: [高二 地理 区域发展 产业转移 全球化]
          c: [smartedu]

  # ================================================================ 历史
  - subject_id: history
    why: >
      高中历史要求的不是记住发生了什么，而是能解释为什么会这样、以及能否换一种可能。

    points:
      - id: hi-his-01
        title: 中国古代政治制度
        grade: 高一
        core: true
        strand: system
        kid: 皇帝要把这么大的国家管住，就要派人、要收税、要让人听话。
        principle: >
          中央集权的核心难题是“信息与忠诚”：地方比中央更了解情况，
          于是必然在放权与收权之间反复摆动。
        model: 委托代理问题：掌握信息的一方与拥有权力的一方不是同一个，制度就是为填补这个缝而生。
        exit: 能说出郡县制与分封制各解决了什么问题、又留下了什么问题。
        video:
          q: [高一 历史 中国古代政治制度 中央集权 郡县制]
          c: [smartedu]

      - id: hi-his-02
        title: 中国近代转型
        grade: 高一
        core: true
        strand: cause
        kid: 一个原来只种地的国家，被外面的机器国家撞上，只能从头学着改变。
        principle: >
          近代转型的主线是“外力冲击—内部回应”的反复循环：
          先学器物、再学制度、最后学思想，每一次都比上一次更深。
        model: 面对持续压力，系统的调整深度随时间递增。这是适应性系统的常见路径。
        exit: 能按“器物—制度—思想”三个阶段举例，并说出每个阶段为何被下一个取代。
        video:
          q: [高一 历史 中国近代史 洋务运动 戊戌变法 新文化运动]
          c: [smartedu]

      - id: hi-his-03
        title: 两次大战与冷战
        grade: 高一
        core: true
        strand: system
        kid: 很多国家互相结盟，一边打起来，另一边就都被拖进去。
        principle: >
          同盟体系把局部冲突放大成全局战争，因为承诺的连锁被提前写进了协议。
          核武器之后大国直接战争的成本高到不可承受，冲突转入代理与制度竞争。
        model: 系统结构决定冲突的放大倍数。改变结构比改变各方意愿更有效。
        exit: 能用“同盟链条”解释一战为何迅速扩大，并说出冷战为何没有变成热战。
        video:
          q: [高一 历史 第一次世界大战 第二次世界大战 冷战格局]
          c: [smartedu, openstax]

      - id: hi-his-04
        title: 全球史与现代化
        grade: 高二
        core: false
        strand: scale
        kid: 全世界从各过各的，慢慢变成谁的事都跟别人有关。
        principle: >
          全球史把不同地区放在同一个框架里，看贸易、疾病、技术如何跨越边界。
          现代化的路径不止一条，但约束（人口、资源、外部环境）是共同的。
        model: 用统一框架比较不同案例，能从差异中筛出真正起作用的变量。
        exit: 能说出一个地区现代化道路上“绕不开”的两个约束，并给出证据。
        video:
          q: [高二 历史 全球史 现代化 世界体系]
          c: [smartedu, openstax]

  # ================================================================ 思想政治
  - subject_id: politics
    why: >
      这门课真正有用的部分是两个：市场经济如何协调千万人的行为，
      以及辩证思维如何避免非黑即白的判断。

    points:
      - id: hi-pol-01
        title: 市场经济与宏观调控
        grade: 高一
        core: true
        strand: system
        kid: 价格是最省力的信号：东西少了它就涨，涨了大家就省着用、多去生产。
        principle: >
          价格机制用分散信息协调行为，不需要一个中心知道所有事。
          市场会失灵（外部性、垄断、信息不对称），此时才需要另一只手。
        model: 分散协调与集中协调各有失效条件。判断用哪个，要看信息在哪、激励在哪。
        exit: 能举一个市场失灵的实例，并说明为什么它自己修不好。
        video:
          q: [高一 政治 市场调节 宏观调控 市场失灵]
          c: [smartedu]

      - id: hi-pol-02
        title: 唯物论与辩证法
        grade: 高二
        core: true
        strand: cause
        kid: 先有实在的东西，再有想法。一样东西变多了，到某个程度就变成了另一样东西。
        principle: >
          量变到质变说的是：连续积累到某个阈值后，系统的行为模式会换一种。
          矛盾分析说的是：找到系统里互相牵制的那一对力量。
        model: 阈值与相变是真实世界的常见结构。线性推理过了阈值就失效。
        exit: 能举出三个“量变引起质变”的例子，并指出各自的阈值在哪。
        video:
          q: [高二 政治 唯物辩证法 量变质变 矛盾]
          c: [smartedu]

      - id: hi-pol-03
        title: 国家制度与治理
        grade: 高一
        core: false
        strand: system
        kid: 一个国家要定规矩、要执行、要有人检查有没有执行到位。
        principle: >
          制度设计的核心是权力结构与监督结构。决策、执行、监督三者如何分合，
          决定了纠错速度与纠错成本。
        model: 纠错能力是系统长期表现的决定因素，而不是初始设计的最优程度。
        exit: 能说出一个治理问题为什么“看得见但改不动”，并指出卡在哪个环节。
        video:
          q: [高一 政治 人民代表大会制度 国家治理体系]
          c: [smartedu]

      - id: hi-pol-04
        title: 法治与规则
        grade: 高二
        core: false
        strand: system
        kid: 规矩要先说清楚，然后对所有人都一样，不能事后才改。
        principle: >
          法治的价值在于可预期：规则公开、稳定、普遍适用，且约束制定者自身。
          程序正义是实质正义的前提条件之一。
        model: 可预期性是长期合作的前提。破坏它的代价通常比一次性的收益大得多。
        exit: 能说明为什么“结果正确但程序错”在制度上仍然不可接受。
        video:
          q: [高二 政治 法治 依法治国 程序正义]
          c: [smartedu]

  # ================================================================ 语文
  - subject_id: chinese
    why: >
      高中语文的落点是“读得懂复杂论证，写得出能被检验的观点”。

    points:
      - id: hi-chn-01
        title: 古诗文阅读
        grade: 高一
        core: true
        strand: symbol
        kid: 古人的文章讲道理时常用典故，先查清典故，再看他为什么用这个。
        principle: >
          古文的信息密度高，是因为省略多。断句能力等于理解能力，
          而断句靠的是句法关系，不是语感。
        model: 恢复省略信息的推断能力，与从不完整观测里还原隐藏状态是同一类任务。
        exit: 能给一段无标点文言断句，并说明每处断句的语法依据。
        video:
          q: [高中 语文 文言文 断句 翻译 方法]
          c: [smartedu, gushiwen]

      - id: hi-chn-02
        title: 议论文的论证结构
        grade: 高二
        core: true
        strand: cause
        kid: 说一个观点，要给出理由，还要给出别人可能怎么反对，然后回答他。
        principle: >
          有说服力的论证必须先处理最强反驳，而不是最弱的。
          举证责任在提出主张的一方，不举证不算论证。
        model: 主动寻找反例是提高结论可靠性的最便宜手段。这也是本组织要求负向对照的原因。
        exit: 能针对一个观点写出最强反驳，并给出回应。
        video:
          q: [高中 语文 议论文 论证结构 反驳]
          c: [smartedu]

      - id: hi-chn-03
        title: 语言的逻辑
        grade: 高一
        core: true
        strand: symbol
        kid: 有些句子听起来有道理，其实悄悄换了话题，或者把“有些”说成了“全部”。
        principle: >
          常见逻辑错误包括偷换概念、以偏概全、循环论证、诉诸权威。
          识别它们的方法是：把句子还原成前提与结论，再看中间有没有缺口。
        model: 论证形式与事实内容分开检查，才能定位错误在哪一层。
        exit: 能在三段材料里各指出一处逻辑谬误并说明是哪一种。
        video:
          q: [高中 语文 逻辑谬误 论证 有效性]
          c: [smartedu]

      - id: hi-chn-04
        title: 限时写作
        grade: 高三
        core: true
        strand: symbol
        kid: 考试作文有时间限制，所以要先花两分钟列出要点，再动笔。
        principle: >
          写作速度受结构决定：先定观点与三段论据，再写开头结尾，中间填论据。
          没有列提纲的写作，时间几乎一定不够。
        model: 先规划再执行，能显著降低高压力任务下的失败率。
        exit: 能在十分钟内列出完整提纲，并在五十分钟内写完。
        video:
          q: [高三 语文 作文 提纲 限时写作 技巧]
          c: [smartedu]

  # ================================================================ 英语
  - subject_id: english
    why: >
      高中英语要能读懂一篇真正的英文说明文或论文摘要。
      这件事的瓶颈通常不是词汇量，是不能一次处理一个长句。

    points:
      - id: hi-eng-01
        title: 语法体系化
        grade: 高一
        core: true
        strand: symbol
        kid: 英语句子像一个架子：主干必须完整，其他东西可以挂在上面。
        principle: >
          把语法整理成“主干 + 修饰”的层级结构，而不是一堆零散规则。
          非谓语动词是最容易出错的挂件，因为它没有自己的主语。
        model: 结构化知识比条目化知识更容易检索与迁移。
        exit: 能标出一个长句的主干与所有修饰成分。
        video:
          q: [高中 英语 语法 体系 句子成分 非谓语动词]
          c: [smartedu, khan-zh]

      - id: hi-eng-02
        title: 长难句拆解
        grade: 高一
        core: true
        strand: symbol
        kid: 句子太长就找动词，找到主干，剩下的都是往主干上挂的。
        principle: >
          拆句顺序固定：先找谓语动词，再找它的主语与宾语，
          最后处理从句与插入语。顺序对了，任何人都会拆。
        model: 面对复杂结构，固定顺序的分解流程比直觉更可靠。
        exit: 能在三分钟内说清一个六十字英文长句的主干与每层修饰。
        video:
          q: [高中 英语 长难句 分析 拆解 方法]
          c: [smartedu]

      - id: hi-eng-03
        title: 听力与口语
        grade: 高一
        core: true
        strand: symbol
        kid: 听不清常常是因为连在一起说变了音，先把它们连起来念熟就听得懂。
        principle: >
          听力障碍多来自连读、弱读、失去爆破这些语音现象，不是词汇量。
          跟读（影子练习）能同时改善听力与发音，因为它在训练同一套加工。
        model: 输出训练能反向改善输入能力，这在任何技能里都成立。
        exit: 能跟读一段一分钟的材料，语速与停顿基本一致。
        video:
          q: [高中 英语 听力 连读 弱读 影子跟读]
          c: [smartedu]

      - id: hi-eng-04
        title: 读写综合
        grade: 高二
        core: true
        strand: symbol
        kid: 读完一篇文章，用三句话把它的意思讲给别人听，这就是概要。
        principle: >
          概要写作考的是压缩而不变形：主旨、关键论据、结论三项必须在，
          例子与修饰可以删。删掉的东西不影响主旨，才算合格。
        model: 压缩必须保结构。只留词不留结构，等于没读。
        exit: 能把一篇三百词的文章压成六十词，主旨与结论完整。
        video:
          q: [高中 英语 概要写作 读后续写 方法]
          c: [smartedu, khan-zh]
