# 语言 · 英语与中文（全学段并行）
#
# 语言在这个仓库里的定位与别的学科不同：它不是知识，是**访问权限**。
# 中文决定你能读多深的原始材料，英文决定你能接触多大范围的一手文献。
# 两条线的排法都是"输入先于输出"，因为这条顺序反了会一直很吃力。

stage_id: language

units:
  # ================================================================ 英语
  - subject_id: english
    why: >
      英语学习的瓶颈几乎从不在“记不住单词”，而在“句子要过一遍中文才懂”。
      目标只有一个：让英语直接指向意思，中间不经过翻译。

    points:
      - id: lang-eng-01
        title: 语音与音标
        grade: 全学段
        core: true
        strand: symbol
        kid: 先学会每个音怎么发，看到音标就能念出来，比背单词管用。
        principle: >
          英语拼写与读音不是一一对应，音标才是可靠表示。
          先建立“声音”这一层，再挂拼写，否则会一直读错并记住错的。
        model: 表示层选对了，后面的学习成本会低一个数量级。
        exit: 能给 20 个没学过的单词标出音标并读对。
        video:
          q: [英语 音标 发音 入门 教程, English phonetics vowels consonants]
          c: [smartedu, khan-zh]

      - id: lang-eng-02
        title: 核心语法骨架
        grade: 全学段
        core: true
        strand: symbol
        kid: 句子就像一个架子：先有主语和动词，其他东西挂在上面。
        principle: >
          英语语法的骨架只有几件事：时态、语态、从句、非谓语。
          把它们整理成一张表，剩下的都是细节填充。
        model: 有结构的知识可检索、可迁移；条目化的知识只能背。
        exit: 能画出四大块语法的表格并说出每格对应什么含义。
        video:
          q: [英语 语法 体系 总结 时态 从句 非谓语]
          c: [smartedu, khan-zh]

      - id: lang-eng-03
        title: 词汇学习方法
        grade: 全学段
        core: true
        strand: symbol
        kid: 一个词根能带出一串词，记住根比一个个记快得多；但也要隔几天回头看一遍。
        principle: >
          词根词缀提供结构线索，间隔重复解决遗忘。
          两者是不同问题的解法，混起来用效果最差：光看词根不复习，等于没背。
        model: 一个方法只解决一个问题。把方法当万能药是最常见的低效来源。
        exit: 能用词根拆出 10 个生词的意思，并按间隔重复表复习两周。
        video:
          q: [英语 单词 词根词缀 记忆法 间隔重复, spaced repetition vocabulary]
          c: [smartedu]

      - id: lang-eng-04
        title: 听力与可理解输入
        grade: 全学段
        core: true
        strand: symbol
        kid: 找稍微难一点点、但基本能听懂的材料，反复听，慢慢就能听懂更多。
        principle: >
          有效输入要略高于当前水平。太难会退回查词（等于做阅读），
          太易没有新信息。听力障碍多来自连读与弱读，不是词汇量。
        model: 学习进度取决于“难度落在可吸收区间内”，这一条对人和对模型都成立。
        exit: 能连续两周每天听 20 分钟不查词，并说出大意。
        video:
          q: [英语 听力 精听 泛听 方法, comprehensible input listening]
          c: [smartedu]

      - id: lang-eng-05
        title: 口语与影子跟读
        grade: 全学段
        core: true
        strand: symbol
        kid: 跟着录音一起说，慢半秒，模仿它的节奏和停顿。
        principle: >
          影子跟读同时训练听觉加工与发音动作，因为说的是同一套语音单位。
          先求节奏与重音正确，再求音准；顺序反了会形成错误的语流习惯。
        model: 输出训练能反向改善输入能力。任何技能里这条都成立。
        exit: 能跟读一段一分钟材料，重音与停顿基本一致。
        video:
          q: [英语 影子跟读 口语 练习方法, shadowing practice English]
          c: [smartedu]

      - id: lang-eng-06
        title: 阅读：精读与泛读
        grade: 全学段
        core: true
        strand: symbol
        kid: 有的文章要一句一句抠（精读），有的只要知道大概讲了啥（泛读）。
        principle: >
          精读解决结构句法，泛读解决语感与速度，两者不能互相替代。
          只用精读会读得极慢，只用泛读会读不出细节。
        model: 两种模式对应两种信息粒度，切换能力本身就是技能。
        exit: 能说出自己这一周精读了几篇、泛读了几篇，各解决了什么问题。
        video:
          q: [英语 精读 泛读 方法 区别]
          c: [smartedu]

      - id: lang-eng-07
        title: 写作：从句子到段落
        grade: 全学段
        core: true
        strand: symbol
        kid: 先写好一句话，再练一段话：先说观点，再给理由，最后收一句。
        principle: >
          写作的难点在组织而非词汇。段落的标准结构（主题句、论据、收束）
          在几乎所有学术写作里都通用。
        model: 结构在不同文体间可迁移，词汇不能。先学结构是更划算的投资。
        exit: 能在十分钟内写出结构完整、含一个例子的五句段落。
        video:
          q: [英语 写作 段落 结构 主题句, paragraph writing]
          c: [smartedu]

      - id: lang-eng-08
        title: 学术英语与读论文
        grade: 大学
        core: true
        strand: symbol
        kid: 论文其实有固定套路：先说要解决什么问题，再说别人做了什么，然后是我的办法和结果。
        principle: >
          学术文本有高度固定的修辞结构，读的时候按结构跳读比逐字读快十倍。
          关键判断在方法与结果之间的对应关系，而不在作者的说辞。
        model: 读论文的目的是判断证据是否支持结论。这需要的是证据训练，不是语言训练。
        exit: 能在二十分钟内读完一篇论文并说出它的证据能否支持结论。
        video:
          q: [学术英语 论文 阅读方法 结构, how to read a research paper]
          c: [arxiv, mit-ocw]

  # ================================================================ 中文
  - subject_id: chinese
    why: >
      中文这条线不是“语文课”，是“使用中文处理复杂信息的能力”：
      读懂古文、写清论证、检索与核验事实。它决定你在中文世界里能走多深。

    points:
      - id: lang-chn-01
        title: 汉字的本义与演变
        grade: 全学段
        core: true
        strand: symbol
        kid: 每个字原来都是一幅画，知道画的是什么，就不会写错了。
        principle: >
          汉字是表意文字，字形携带意义线索。本义与引申义之间有可追溯的路径，
          知道路径就能推断没见过的用法。
        model: 词义演变是有方向的，抓住方向就能预测新用法——这与理解任何符号系统同理。
        exit: 能查出一个字的字形演变，并说出它的本义与现在常用义的差别。
        video:
          q: [汉字 字源 演变 本义 讲解]
          c: [zdic, smartedu]

      - id: lang-chn-02
        title: 文言语法与虚词
        grade: 中学至大学
        core: true
        strand: symbol
        kid: 古人的话省略得多，所以一个字常常顶现在的一个词。
        principle: >
          文言虚词的功能比实词的意义更稳定，所以先掌握“之、其、而、以、于”
          的几种核心功能，读任何古文都能先搭出骨架。
        model: 先掌握高频功能词，是任何新语言的最低启动成本策略。
        exit: 能读一段无注释文言，说出大意并指出两处关键虚词的作用。
        video:
          q: [文言文 虚词 之其而以于 用法 总结]
          c: [gushiwen, smartedu]

      - id: lang-chn-03
        title: 诗词格律与意象
        grade: 中学
        core: false
        strand: symbol
        kid: 古诗要读得顺口，是因为有固定的节奏和押韵规律。
        principle: >
          格律是形式约束，意象是意义约束。约束越强，
          诗人能达到的表达效率越高——这是“限制产生力量”的范例。
        model: 约束不是障碍，是压缩表达的手段。这个认识在工程与写作里同样有用。
        exit: 能指出一首律诗的押韵字与对仗句，并说出它的主要意象。
        video:
          q: [古诗词 格律 平仄 意象 鉴赏]
          c: [gushiwen, smartedu]

      - id: lang-chn-04
        title: 现代汉语语法
        grade: 中学
        core: true
        strand: symbol
        kid: 一个句子太长就先找主语，再找动词，剩下的都是补充说明。
        principle: >
          现代汉语的主干是“主语加谓语”，修饰语顺序固定（定在前、状在动前）。
          语序错了会改变意思，因为汉语缺少形态变化，语序是主要语法手段。
        model: 语序承载语法信息，去掉它就丢信息。信息必须挂在结构上，不能只挂在词上。
        exit: 能把一个歧义句改写成两个意思明确的句子。
        video:
          q: [现代汉语 语法 句法成分 语序 歧义]
          c: [smartedu]

      - id: lang-chn-05
        title: 逻辑与论证写作
        grade: 中学至大学
        core: true
        strand: cause
        kid: 说一句话要有理由，理由要能经得起别人问“凭什么”。
        principle: >
          论证的三要素是主张、证据、推理。三者任一缺失，结论都不成立。
          先写出最强反驳再回应，是区分好论证与凑字数的分界线。
        model: 论证结构与实验结果的结构是同一回事：主张必须由可检验的证据支撑。
        exit: 能写出一个含主张、两条证据与一处反驳回应的完整段落。
        video:
          q: [议论文 论证 结构 反驳 写作, argument structure writing]
          c: [smartedu]

      - id: lang-chn-06
        title: 检索、引用与事实核验
        grade: 大学
        core: true
        strand: cause
        kid: 说一件事之前，先查一下是谁最先说的、他凭什么知道。
        principle: >
          信息要分层：一手材料、官方数据、二手转述、无来源转述，可信度依次下降。
          引用要能定位到具体位置，否则别人无法核验。
        model: 这是本组织证据规则的日常版本。做不到这条，写出来的东西只能算观点。
        exit: 能给出一段带来源的事实陈述，并说明这条来源属于哪一层。
        video:
          q: [信息检索 文献引用 事实核查 方法]
          c: [arxiv]

      - id: lang-chn-07
        title: 经典阅读
        grade: 中学至大学
        core: true
        strand: symbol
        kid: 老书里的话很多时候今天还能用，因为它们说的是人的处境。
        principle: >
          经典文本的价值在于它反复处理同一类问题，并且把难处讲清楚了。
          读法是先弄清它在回答什么问题，再看它给出的解法在什么前提下成立。
        model: 把文本当作“对某个问题的解法”来读，才能判断它今天是否还成立。
        exit: 能说出一部经典在回答什么问题、它的答案依赖什么前提。
        video:
          q: [经典 阅读 方法 论语 史记 导读]
          c: [gushiwen, zdic]

      - id: lang-chn-08
        title: 中文写作的清晰性
        grade: 全学段
        core: true
        strand: symbol
        kid: 一句话只说一件事，短的比长的好懂。
        principle: >
          清晰来自结构而非文采：一段一个主题，一句一个判断，
          名词要具体，动词要有动作。做不到通常不是因为不会写，是因为还没想清。
        model: 表达不清几乎总是思考不清的症状。改文章的有效办法是改结构，不是换词。
        exit: 能把自己写的一段话删掉三分之一而信息不减少。
        video:
          q: [中文写作 清晰 表达 修改 方法]
          c: [smartedu]
