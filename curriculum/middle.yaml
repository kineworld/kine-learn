# 初中 · 7-9 年级
#
# 初中是"把世界变成可计算的量"的那三年。判断学没学懂只有一个标准：
# 能不能从一个现象写出一条式子，再由式子推出没见过的情况。

stage_id: middle

units:
  # ================================================================ 数学
  - subject_id: math
    why: >
      初中数学的核心不是运算，是“关系”。方程是关系，函数是关系，相似也是关系。
      把关系写成符号，才能在不做实验的情况下得到结论。

    points:
      - id: mid-math-01
        title: 有理数与数轴
        grade: 七年级
        core: true
        strand: number
        kid: 数轴像一把尺子，往右是越来越大，往左是越来越小。减 5 就是往左走 5 步。
        principle: >
          引入负数后，减法统一成“加一个相反数”，于是加与减不再需要两套规则。
          符号的作用是压缩规则的数量。
        model: 好的表示法让复杂操作变简单。选择表示法是建模的第一决策，不是最后一步。
        exit: 能在数轴上表示 -3 加 5 的结果，并解释为什么“减负等于加正”。
        video:
          q: [七年级 数学 有理数 数轴 相反数]
          c: [smartedu, khan-math]

      - id: mid-math-02
        title: 整式与因式分解
        grade: 八年级
        core: true
        strand: structure
        kid: 把一串式子里的公共部分提到前面去，就像把礼物盒里的东西拿出来排好。
        principle: >
          因式分解是把一个整体拆成更小的乘积。乘法与分解互为逆过程，
          所以分解的结果可以用乘回去检验——这是自查的通用套路。
        model: 能把自己的结果倒推回输入，才算真的算对。可逆性是最便宜的自检手段。
        exit: 能分解常见的二次三项式，并用乘回去验证每一步。
        video:
          q: [八年级 数学 因式分解 十字相乘]
          c: [smartedu, khan-math]

      - id: mid-math-03
        title: 方程与不等式
        grade: 七至八年级
        core: true
        strand: symbol
        kid: 天平两边同时做一样的事，天平还是平的。方程就是那架天平。
        principle: >
          等式两边同做一种可逆操作，解集不变。解方程的合法性来自这条不变性，
          不来自“移项要变号”这类口诀。不等式乘负数要变方向，正是因为那一步不可逆地翻了序。
        model: 变换必须在变换后仍保住你关心的性质，否则得到的结论无意义。
        exit: 能说出“移项”背后到底是哪一步操作，并解释不等式什么时候要变号。
        prereq: [pri-math-06]
        video:
          q: [七年级 数学 一元一次方程 解法, 不等式 变号 原理]
          c: [smartedu, khan-math]

      - id: mid-math-04
        title: 一元二次方程
        grade: 九年级
        core: true
        strand: change
        kid: 有些问题有两个答案，比如“什么数的平方是 9”，正 3 和负 3 都行。
        principle: >
          二次方程最多两个解，因为抛物线最多穿过水平线两次。
          判別式决定有没有解，它的正负是几何事实的代数翻译。
        model: “有多少个解”是比“解是多少”更稳的信息，模型评估里同样如此。
        exit: 能用配方法解一般二次方程，并说出判别式为零时几何上发生了什么。
        video:
          q: [九年级 数学 一元二次方程 配方法 判别式]
          c: [smartedu, khan-math]

      - id: mid-math-05
        title: 函数与图像
        grade: 八年级
        core: true
        strand: change
        kid: 给机器一个数，它吐另一个数出来。把所有输入输出画成点，就得到一条线。
        principle: >
          函数是“一个输入只对应一个输出”的规则。图像是这条规则的几何化身，
          式子和图像是同一个东西的两种写法。
        model: 世界模型的预测器就是一个函数。看清它的定义域与值域，就知道它能说什么。
        exit: 看到一次函数的式子能画出图，看到图能写出式子。
        video:
          q: [八年级 数学 函数 一次函数 图像, functions and graphs basics]
          c: [smartedu, desmos]

      - id: mid-math-06
        title: 勾股定理
        grade: 八年级
        core: true
        strand: number
        kid: 直角三角形的两条短边各自乘自己相加，等于长边乘自己。
        principle: >
          这条定理把“直角”这个几何事实翻译成“平方和相等”这个代数事实。
          几何与代数之间的翻译能力，是现代数学的起点。
        model: 一条等式能承载一整个几何世界。表示之间的等价，是理解深度的标志。
        exit: 能用两种不同方式证明它，并说出证明各用了什么假设。
        video:
          q: [八年级 数学 勾股定理 证明 面积法, Pythagorean theorem proof]
          c: [smartedu, khan-math]

      - id: mid-math-07
        title: 全等与相似
        grade: 八至九年级
        core: true
        strand: scale
        kid: 一模一样大的两个图形是全等；只是按比例放大缩小的，是相似。
        principle: >
          全等是“形状与大小都不变”，相似是“只保住形状”。
          相似之所以强大，是因为角度与比例在放缩下不变——不变的东西才值得当工具。
        model: 找出在变换下不变的量，就能跨越尺度做预测。这是物理与机器学习共用的手法。
        exit: 能判断两个三角形是否相似并写出对应边比例，说明用了哪条判定。
        video:
          q: [九年级 数学 相似三角形 判定 应用]
          c: [smartedu, khan-math]

      - id: mid-math-08
        title: 圆
        grade: 九年级
        core: false
        strand: structure
        kid: 圆就是“到中心一样远的所有点”。半径一样远，是它唯一的规矩。
        principle: >
          圆的全部性质都从“到定点等距”这一条推出来：垂径、切线、圆周角。
          定义越简单，能推出的东西越多。
        model: 从少数公理推出大量结论，是理论结构的最小样本。
        exit: 能用“到圆心等距”解释为什么直径所对的圆周角是直角。
        video:
          q: [九年级 数学 圆 圆周角定理 切线]
          c: [smartedu, khan-math]

      - id: mid-math-09
        title: 坐标系与直线
        grade: 八年级
        core: true
        strand: symbol
        kid: 用两个数就能说清一个点在哪儿：横着走几个，竖着走几个。
        principle: >
          坐标系把位置变成数组，把运动变成数组的变化。
          有了它，几何问题可以当代数题算，反之亦然。
        model: 状态向量的雏形。世界模型的“状态”就是一个高维坐标系里的点。
        exit: 能求两点连线与坐标轴的交点，并解释斜率在这道题里代表什么。
        video:
          q: [八年级 数学 平面直角坐标系 斜率]
          c: [smartedu, desmos]

      - id: mid-math-10
        title: 统计与概率初步
        grade: 九至八年级
        core: true
        strand: cause
        kid: 平均数像分蛋糕，大家都分到一样多。扔硬币次数多了，正面的比例会靠近一半。
        principle: >
          平均数、中位数、众数回答的是不同问题，选错了会得出相反结论。
          频率在大量重复下趋近概率，但“趋近”不等于“下一次一定补偿回来”。
        model: 用少数样本推断整体，必须说明不确定性。没有误差说明的数字不能用来下结论。
        exit: 能构造一组数据，让它的平均数与中位数给出相反的印象。
        video:
          q: [九年级 数学 概率初步 频率与概率, average vs median misleading]
          c: [smartedu, phet]

  # ================================================================ 物理
  - subject_id: physics
    why: >
      初中物理只做一件事：把“看到的现象”换成“能算的量”。
      速度、密度、压强、电阻都是这个换法的产物。公式记错没关系，量纲写对就不会离谱。

    points:
      - id: mid-phy-01
        title: 测量与单位
        grade: 八年级
        core: true
        strand: number
        kid: 量身高要用对尺子。单位不一样的两个数不能直接比。
        principle: >
          单位是约定的比较基准。国际单位制把长度、质量、时间定为基本量，
          其余单位由它们组合而成——这就是量纲。
        model: 量纲检查是最便宜的纠错工具，能发现大部分公式记忆错误。
        exit: 能说出速度、密度、压强的单位分别由哪几个基本单位组成。
        video:
          q: [八年级 物理 长度测量 误差 单位换算, SI units and dimensional analysis]
          c: [smartedu, nist-constants]

      - id: mid-phy-02
        title: 运动与速度
        grade: 八年级
        core: true
        strand: change
        kid: 同样一段路，走得快的人用的时间短。速度就是“一秒走多远”。
        principle: >
          位移是带方向的，路程是不带方向的。平均速度等于总位移除以总时间，
          不等于各段速度的平均。混这两件事是初中第一个高频错误。
        model: 区分“总量”与“平均量”，是所有时间序列分析的入门门槛。
        exit: 能算一辆车上下坡往返的平均速度，并说明为什么它比两个速度的算术平均小。
        video:
          q: [八年级 物理 速度 平均速度 路程与位移]
          c: [smartedu, phet]

      - id: mid-phy-03
        title: 力与牛顿定律
        grade: 八至九年级
        core: true
        strand: energy
        kid: 不推它它就不动，推它它才动。你推墙，墙也在推你。
        principle: >
          力不是维持运动的原因，是改变运动的原因。
          力总是成对出现，作用在两个不同物体上，所以不能互相抵消。
        model: 因果链条上，先分清“作用”与“反作用”，才能谈“是谁改变了谁”。
        exit: 能画出斜面上一个静止物体的受力图，并说明每一对作用力与反作用力。
        video:
          q: [八年级 物理 牛顿第一定律 二力平衡 受力分析, Newton laws explained]
          c: [smartedu, phet]

      - id: mid-phy-04
        title: 质量、密度与压强
        grade: 八年级
        core: true
        strand: number
        kid: 同样大小的铁块比木块重。同样重的鞋，高跟鞋踩人更疼，因为力挤在小地方。
        principle: >
          密度是“单位体积的质量”，压强是“单位面积的受力”。
          把不同量相除得到新量，是人类压缩信息最常用的手法。
        model: 用比值消除无关变量，才能看出真正起作用的因素。
        exit: 能算出一个物体在不同液体里受到的浮力差异，并说明密度在其中起什么作用。
        video:
          q: [八年级 物理 密度 压强 浮力 计算]
          c: [smartedu, phet]

      - id: mid-phy-05
        title: 功与能
        grade: 九至八年级
        core: true
        strand: energy
        kid: 用滑轮吊东西省力，但绳子要多拉一段。省了力就多走路，没有白赚。
        principle: >
          功等于力乘沿力方向的距离。机械可以省力或省距离，但功不会凭空变少。
          这就是能量守恒在初中阶段的样子。
        model: 守恒律是“跳过细节直接得结论”的合法途径，也是核验任何模型的第一条尺子。
        exit: 能用两种方式算出同一件事做的功，并说出多出来或少了的部分去了哪里。
        video:
          q: [九年级 物理 功 功率 机械效率 滑轮组]
          c: [smartedu, phet]

      - id: mid-phy-06
        title: 声与光
        grade: 八年级
        core: false
        strand: energy
        kid: 声音是空气在抖，光不用空气也能走，所以真空里能看见太阳但听不到响。
        principle: >
          声需要介质，光是电磁波不需要介质——这个差别是十九世纪物理最大的谜题入口。
          反射、折射都能用“沿直线传播加最短路径”理解。
        model: 一个反常现象往往指向更深的结构，而不是“例外”。
        exit: 能画出光从空气射入水中的折射路径，并解释为什么筷子看起来折了。
        video:
          q: [八年级 物理 光的折射 反射 声音传播]
          c: [smartedu, phet]

      - id: mid-phy-07
        title: 电流、电压与电阻
        grade: 九年级
        core: true
        strand: system
        kid: 电流像水管里的水流，电压像水压，电阻像管子粗细。
        principle: >
          这套水管比喻能帮你记住定性关系，但比喻在水管不漏水、电流不减少这一点上会骗你。
          用比喻要用到“它什么时候失效”为止。
        model: 类比的可靠性要单独检验，这比类比本身重要。
        exit: 能画出串联与并联电路的电流路径，并说出比喻在哪一点不成立。
        video:
          q: [九年级 物理 电流 电压 电阻 串并联电路]
          c: [smartedu, phet]

      - id: mid-phy-08
        title: 欧姆定律与电功率
        grade: 九年级
        core: true
        strand: energy
        kid: 电压越大水流越急，电阻越大水流越小，两句话可以写成一个式子。
        principle: >
          电功率等于电流乘电压。同样的功率下，电压越低电流越大，
          这就是高压输电要升压的原因——损耗只跟电流的平方有关。
        model: 一个工程决定背后往往是一条平方律。找到平方项，就能判断该往哪边使力。
        exit: 能算出同一功率下改变电压时线路损耗变化多少倍。
        video:
          q: [九年级 物理 欧姆定律 电功率 焦耳定律 计算]
          c: [smartedu, phet]

  # ================================================================ 化学
  - subject_id: chemistry
    why: >
      化学研究“东西是什么、怎么变成别的东西”。它的全部威力来自一张表和一个守恒：
      元素周期表，以及原子不会凭空消失。

    points:
      - id: mid-che-01
        title: 分子、原子与离子
        grade: 九年级
        core: true
        strand: structure
        kid: 东西都是由很小很小的颗粒搭起来的。糖水里看不到糖，是糖被拆得太小了。
        principle: >
          物质由粒子构成，粒子的种类与排列决定物质的性质。
          一个方块字的笔画像原子，字本身像分子。
        model: “整体性质由局部组成与排列决定”，是结构决定功能的通用命题。
        exit: 能用粒子观点解释为什么水蒸气看不见而白雾看得见。
        video:
          q: [九年级 化学 分子 原子 离子 微观解释]
          c: [smartedu, phet]

      - id: mid-che-02
        title: 元素与化学式
        grade: 九年级
        core: true
        strand: structure
        kid: 世界上东西很多，但拆到不能再拆，只有一百来种小零件。元素就是零件名字。
        principle: >
          元素由原子核内质子数决定。化学式是“有哪些原子、各多少个”的记账方式，
          原子个数比是化学式里最重要的信息。
        model: 用有限符号系统覆盖无穷组合，是元素符号表与编程语言共有的设计。
        exit: 看到化学式能说出原子个数比与元素种类。
        video:
          q: [九年级 化学 元素 化学式 化合价 书写]
          c: [smartedu, phet]

      - id: mid-che-03
        title: 化学方程式与质量守恒
        grade: 九年级
        core: true
        strand: change
        kid: 东西烧掉了，不是消失了，是跑到空气里去了。
        principle: >
          反应前后的原子种类与个数都不变，所以物质总质量不变。配平就是在数原子。
          所谓的“质量减少”，是有一份跑到了你没称的地方。
        model: 守恒是记账。记账不平，一定是漏了某个账户，不是世界出了问题。
        exit: 能配平常见方程式，并用守恒解释“镁条燃烧后变重”。
        video:
          q: [九年级 化学 质量守恒定律 化学方程式 配平]
          c: [smartedu, phet]

      - id: mid-che-04
        title: 溶液与浓度
        grade: 九年级
        core: true
        strand: number
        kid: 一杯糖水，糖放得多就甜。甜不甜看的是“多少糖配多少水”，不是糖的总量。
        principle: >
          浓度是比值。饱和是溶解与析出达到动态平衡的状态，
          此时看起来什么都没变，其实两个方向都在进行。
        model: “静止的外表下有两个相反过程在抵消”，是动态平衡的通用图像。
        exit: 能算出稀释前后溶质质量不变这一关系，并说明饱和时为什么不再溶解。
        video:
          q: [九年级 化学 溶质质量分数 饱和溶液 溶解度]
          c: [smartedu, phet]

      - id: mid-che-05
        title: 酸、碱、盐
        grade: 九年级
        core: false
        strand: structure
        kid: 醋是酸的，肥皂水是滑的。酸和碱碰在一起，两边的脾气都没了，叫中和。
        principle: >
          酸碱的强弱由溶液中氢离子与氢氧根离子浓度决定。
          pH 是对数刻度，数值差 1 意味着浓度差 10 倍——这是最容易被读错的一条。
        model: 对数刻度把跨数量级的变化压成小数字，代价是差值不再等距。
        exit: 能说出 pH 从 3 变到 5 意味着氢离子浓度变成几分之一。
        video:
          q: [九年级 化学 酸碱盐 中和反应 pH 计算]
          c: [smartedu, phet]

      - id: mid-che-06
        title: 化学反应中的能量
        grade: 九年级
        core: true
        strand: energy
        kid: 烧东西会发热，有些反应却要一直加热才肯开始。
        principle: >
          反应会吸热或放热，因为产物的“能量水平”与反应物不同。
          需要先加热的，往往是“启动需要一笔启动费”。
        model: 有阈值的系统会表现出突然开关的行为，这是非线性世界的第一印象。
        exit: 能举出两个吸热、两个放热的反应，并说明放热是不是等于一定会自己发生。
        video:
          q: [九年级 化学 吸热反应 放热反应 能量变化]
          c: [smartedu, phet]

  # ================================================================ 生物
  - subject_id: biology
    why: >
      生物学科里最重要的不是背器官名字，而是理解一件事：
      生命是“在变化中维持不变”的过程。这句话在所有层次都成立。

    points:
      - id: mid-bio-01
        title: 细胞
        grade: 七年级
        core: true
        strand: structure
        kid: 所有活的东西都是由一个个小房间组成的。小房间会分裂，一变二。
        principle: >
          细胞是生命的最小功能单位。结构上分区、功能上分工，
          分工效率来自“把不同反应关在不同房间里”。
        model: 隔间化是复杂系统普遍采用的策略。计算机进程、工厂车间同理。
        exit: 能说出细胞膜、细胞核、线粒体各负责什么，并解释为什么分开更好。
        video:
          q: [七年级 生物 细胞结构 动植物细胞, cell structure overview]
          c: [smartedu, khan-science]

      - id: mid-bio-02
        title: 遗传与 DNA
        grade: 八年级
        core: true
        strand: symbol
        kid: 孩子像爸爸妈妈，因为父母把一张“说明书”各给了一半。
        principle: >
          DNA 用四种碱基的排列顺序记录信息。信息的载体是顺序，不是材料本身。
          换掉一个字母可能没事，也可能让整台机器停摆。
        model: 生命把信息与物质分离：物质可以换，顺序必须保住。这是存储与计算分工的原型。
        exit: 能用“字母顺序”的类比解释基因突变为什么有时没影响、有时很严重。
        video:
          q: [八年级 生物 遗传 基因 DNA 碱基, DNA structure explained]
          c: [smartedu, khan-science]

      - id: mid-bio-03
        title: 人体系统
        grade: 七年级
        core: false
        strand: system
        kid: 胃把食物弄碎，血液把它运到全身，肺负责换气，心脏是水泵。
        principle: >
          各系统通过血液与神经彼此耦合，任何一处出问题都会让别处改变工作方式。
          单看一个器官，通常看不出病因。
        model: 耦合系统不能孤立诊断。拆开研究的结论，要再放回系统里检验。
        exit: 能说出跑步时呼吸、心跳、体温三者为什么同时变化。
        video:
          q: [七年级 生物 人体八大系统 血液循环, human body systems overview]
          c: [smartedu, khan-science]

      - id: mid-bio-04
        title: 生态系统与能量流
        grade: 八年级
        core: true
        strand: energy
        kid: 太阳把能量给了草，草给了兔子，兔子给了狐狸。每转一手，都要花掉一大半。
        principle: >
          能量在食物链每层传递只剩约十分之一，物质却能循环使用。
          能量单向流动、物质循环流动，是生态系统最容易被混掉的一对区别。
        model: 分清“单向流”与“循环流”，才能判断一个系统的可持续性。
        exit: 能画出一个生态系统中的能量流与物质循环，并指出两者的不同。
        video:
          q: [八年级 生物 生态系统 能量流动 物质循环]
          c: [smartedu, khan-science]

      - id: mid-bio-05
        title: 进化与适应
        grade: 八年级
        core: true
        strand: cause
        kid: 长脖子的鹿能吃到高处的叶子，活下来生小鹿，所以它们的后代脖子越来越长。
        principle: >
          变异先于选择出现，环境只是筛选者，不是引导者。
          演化没有“目标”，也没有“用进废退”的方向性承诺。
        model: 这是“无智能的机制产生看起来有目的的结果”的第一个严肃例子。
        exit: 能说清“长颈鹿脖子变长”这句话里哪部分是变异、哪部分是选择。
        video:
          q: [八年级 生物 自然选择 进化 适应, natural selection explained]
          c: [smartedu, khan-science]

  # ================================================================ 地理
  - subject_id: geography
    why: >
      地理教的是“为什么这里长这样”。把地图、气候、人口放在一个坐标系里看，
      人间的大部分差异都能找到物理原因。

    points:
      - id: mid-geo-01
        title: 地球与经纬度
        grade: 七年级
        core: true
        strand: scale
        kid: 地球是个球。竖线量东西，横线量南北，两条线一交叉就能说清任何地方在哪儿。
        principle: >
          经度由本初子午线起算、与时间直接相关，纬度由赤道起算、与太阳高度直接相关。
          坐标系统把“位置”变成两个数，于是位置可计算。
        model: 一切可计算的前提是先把对象编码成数。坐标系是最早的编码方案。
        exit: 能根据两个城市的经纬度说出它们的相对方向与大致时差。
        video:
          q: [七年级 地理 经纬网 经纬度 定位]
          c: [smartedu]

      - id: mid-geo-02
        title: 板块运动与地震
        grade: 七年级
        core: true
        strand: change
        kid: 地面不是一整块，是拼起来的好几块，它们慢慢在挪，挤在一起就会震。
        principle: >
          地震带分布与板块边界高度重合。能量在挤压中累积，
          释放时是突发的——这是“缓慢加载、突然释放”的原型。
        model: 慢变量积累到阈值后突然释放，是地震、雪崩、破产共同的动力学形状。
        exit: 能在地图上指出两处主要地震带，并说明它们为什么在那里。
        video:
          q: [七年级 地理 板块构造 地震带 分布]
          c: [smartedu]

      - id: mid-geo-03
        title: 大气环流与气候
        grade: 七年级
        core: true
        strand: system
        kid: 太阳把赤道晒得最热，热空气往上升、往两边跑，冷空气再补回来，风就这么转起来。
        principle: >
          受热差异加上地球自转，形成稳定的环流与风带。
          气候是长期平均，天气是具体某天；两句话说的是不同时间尺度上的东西。
        model: 平均量与瞬时量属于不同层次，混用会得出错误结论。
        exit: 能解释为什么同纬度的沿海与内陆气候差别很大。
        video:
          q: [七年级 地理 大气环流 气候类型 成因]
          c: [smartedu]

      - id: mid-geo-04
        title: 水循环
        grade: 七年级
        core: false
        strand: system
        kid: 海水被太阳晒上去变成云，云飘到山上落下来变成河，河又流回海里。
        principle: >
          水循环把能量与物质连起来：太阳供能，水做载体。
          循环之所以能稳定运转，是因为蒸发与降水在长期上收支平衡。
        model: 收支平衡是判断一个循环是否可持续的唯一标准。
        exit: 能说出水的三种状态在循环中各自出现在哪一步。
        video:
          q: [七年级 地理 水循环 类型 意义]
          c: [smartedu]

      - id: mid-geo-05
        title: 人口、资源与区域差异
        grade: 八年级
        core: false
        strand: system
        kid: 有山有水的平地好种地，人就多；沙漠里住的人就少。
        principle: >
          人口分布首先受自然条件约束，其次受产业与交通约束。
          资源禀赋差异是区域分工的物理起点。
        model: 约束条件下的分布，几乎总能被少数几个变量解释大半。
        exit: 能指出中国的几条人口稠密带，并各说一个原因。
        video:
          q: [八年级 地理 人口分布 影响因素 资源]
          c: [smartedu]

  # ================================================================ 历史
  - subject_id: history
    why: >
      历史真正教的是“证据的等级”：一段记载是原始材料还是转述，说这话的人有没有动机。
      这项能力用在一千年前的事件上，和用在一份今天的新闻上是一样的。

    points:
      - id: mid-his-01
        title: 时间轴与史料
        grade: 七年级
        core: true
        strand: cause
        kid: 事情有先后，先把年代排好画成一条线，再问“谁在前谁在后”。
        principle: >
          史料分一手与转述，价值不同。写史的人有自己的立场与信息限制，
          所以要问“他从哪里知道的”。
        model: 证据的来源等级决定结论的可信度上限。这是全部证据学科的公共基础。
        exit: 拿到一段材料，能说出它是一手还是转述，并指出作者可能不知道什么。
        video:
          q: [七年级 历史 史料实证 一手史料 二手史料]
          c: [smartedu]

      - id: mid-his-02
        title: 中国历史脉络
        grade: 七年级
        core: true
        strand: system
        kid: 从秦朝开始，中国大部分时间是一个大国家，中间分分合合好几回。
        principle: >
          朝代更替的常见链条是：统一后制度僵化、财政恶化、外部压力上升、
          内部失控。链条重复出现，但每次的具体原因不同。
        model: 重复出现的模式值得建模，但不能因此认为结局必然。
        exit: 能用不超过十句话讲清从秦到清的脉络，并指出哪几处是关键转折。
        video:
          q: [七年级 历史 中国古代朝代 脉络 记忆方法]
          c: [smartedu]

      - id: mid-his-03
        title: 工业革命与近代转型
        grade: 九年级
        core: true
        strand: energy
        kid: 以前靠人和牲口出力，后来机器烧煤出力。力气突然变多，整个世界都跟着变了。
        principle: >
          工业革命的起点是“把能量从生物体转移到化石燃料”。
          能量获取方式的改变，会重排人口、城市、军事与政治结构。
        model: 找到系统的能量入口，往往就找到了它命运的支配变量。
        exit: 能说出蒸汽机解决的核心问题是什么，以及它先改变了哪三件事。
        video:
          q: [九年级 历史 工业革命 影响 蒸汽机]
          c: [smartedu, openstax]

      - id: mid-his-04
        title: 因果与史料批判
        grade: 八至九年级
        core: true
        strand: cause
        kid: 两件事一起发生，不等于一件造成了另一件。
        principle: >
          判断因果要有干预与对照：同一时间点，有与没有这个条件的两种情况比较。
          做不到对照时，只能说相关。
        model: 相关与因果的区分，是全部实验科学的入门门槛，也是本组织证据规则的核心。
        exit: 能挑出一个“把相关说成因果”的历史论断，并说出需要什么材料才能检验。
        video:
          q: [九年级 历史 历史解释 因果关系 论证]
          c: [smartedu]

  # ================================================================ 语文
  - subject_id: chinese
    why: >
      初中语文开始处理“言外之意”。这一步能过，读任何专业材料都不会被句子结构卡住。

    points:
      - id: mid-chn-01
        title: 文言实词与虚词
        grade: 七至九年级
        core: true
        strand: symbol
        kid: 古人的话跟现在不一样。有的字意思变了，有的字只是用来连句子。
        principle: >
          文言里一个字常对应现代汉语的一个词。实词靠积累，虚词靠功能，
          虚词的功能比意思更稳定，所以先抓虚词反而快。
        model: 变化的部分多，不变的部分少，把不变的部分先钉住是通用的学习顺序。
        exit: 能读一段没有注释的浅近文言，说出大意与两处关键虚词的作用。
        video:
          q: [初中 语文 文言文 实词 虚词 用法]
          c: [smartedu, gushiwen]

      - id: mid-chn-02
        title: 三种基本文体
        grade: 七至九年级
        core: true
        strand: symbol
        kid: 写事的、说明白的、讲道理的，是三种不同的写法，别混着用。
        principle: >
          记叙回答“发生了什么”，说明回答“是什么样”，议论回答“应该怎么判断”。
          文体决定结构，结构决定段落该放什么。
        model: 先定任务类型再定输出结构，是任何写作与推理的通用顺序。
        exit: 看清一个题目要求哪种文体，并能列出对应结构。
        video:
          q: [初中 语文 记叙文 说明文 议论文 区别]
          c: [smartedu]

      - id: mid-chn-03
        title: 修辞与句子的逻辑
        grade: 八至九年级
        core: true
        strand: symbol
        kid: 一句话太绕就拆开写。把两件事并列、因果、转折分清楚，别人一眼就懂。
        principle: >
          病句大多不是语法错，是逻辑搭配错：主语换了、先后倒了、范围过了。
          改句子先改逻辑，最后才改用词。
        model: 结构清晰先于表达漂亮。表达不清通常是没想清。
        exit: 能在一段话里找出三处逻辑不严的地方并改掉。
        video:
          q: [初中 语文 病句 修改 逻辑 搭配]
          c: [smartedu]

      - id: mid-chn-04
        title: 古诗鉴赏
        grade: 七至九年级
        core: false
        strand: symbol
        kid: 古诗写景多半是在写心情，看它选了哪些景物，就知道诗人什么情绪。
        principle: >
          意象是诗人选出来的，选择本身就是态度。情绪通过选材传递，
          而不是靠直接说“我很难过”。
        model: 通过选择传递信息，比直接声明信息承载量更大，也更依赖共同的文化前提。
        exit: 能在两首同题材的诗里各指三个意象，说出情绪差别。
        video:
          q: [初中 语文 古诗鉴赏 意象 情感]
          c: [smartedu, gushiwen]

  # ================================================================ 英语
  - subject_id: english
    why: >
      初中英语是从“会说几句”到“能读完一段”的阶段。
      转折点只有一个：能不能不先把句子翻译成中文就看懂。

    points:
      - id: mid-eng-01
        title: 时态体系
        grade: 七至九年级
        core: true
        strand: change
        kid: 英语的动词要说明事情是什么时候、是什么状态，所以动词会变样子。
        principle: >
          英语时态是“时间”与“体”两个维度的组合，不是一堆要背的形式。
          先把两个维度画成表格，形式自然会落进格子里。
        model: 用维度组合代替枚举记忆，能显著降低复杂度。
        exit: 能画出一张时态表，说出每个格子表达什么时间与状态。
        video:
          q: [初中 英语 时态 体系 表格总结, English tense aspect explained]
          c: [smartedu, khan-zh]

      - id: mid-eng-02
        title: 从句初步
        grade: 八至九年级
        core: true
        strand: symbol
        kid: 一句话里可以再塞一句话进去，用来补充说明人或事。
        principle: >
          从句是“句子当成分用”。判断从句类型靠的是它在主句里充当什么角色，
          不是靠它由哪个词引导。
        model: 递归嵌套是语言的核心能力，也是任何表达能力足够的符号系统的必备特征。
        exit: 能在一个长句里标出从句边界，并说出它修饰谁。
        video:
          q: [初中 英语 定语从句 宾语从句 讲解]
          c: [smartedu, khan-zh]

      - id: mid-eng-03
        title: 阅读策略
        grade: 八至九年级
        core: true
        strand: symbol
        kid: 不认识的词先跳过，看句子说的是好话还是坏话，意思大概就出来了。
        principle: >
          阅读要分层：先扫结构拿主旨，再抓细节定位。
          生词率低于约百分之五时不必查词，靠上下文能补上。
        model: 先拿粗颗粒结构，再补细节，是处理高维输入的通用顺序。
        exit: 能读一篇没读过的短文，先说出主旨，再回答两个细节问题而不查词。
        video:
          q: [初中 英语 阅读 技巧 主旨 略读]
          c: [smartedu, khan-zh]

      - id: mid-eng-04
        title: 写作结构
        grade: 七至九年级
        core: true
        strand: symbol
        kid: 先说要讲什么，再说三条理由，最后总结一句。
        principle: >
          说明与议论类文本的高分结构几乎固定：观点、理由、证据、收束。
          变化只在用词与细节，不在骨架。
        model: 稳定的模板是效率来源。先掌握可复用骨架，再谈个人风格。
        exit: 能在二十分钟内写出结构完整的五句话段落。
        video:
          q: [初中 英语 作文 结构 模板 连接词, paragraph writing structure]
          c: [smartedu, khan-zh]

  # ================================================================ 道德与法治
  - subject_id: civics
    why: >
      这门课的价值在两个地方：知道权利与义务怎么配套，以及知道社会问题通常没有单一答案。

    points:
      - id: mid-civ-01
        title: 法律与权利
        grade: 七年级
        core: true
        strand: system
        kid: 规则写下来并且大家都必须守，就叫法律。有权利就有对应的义务。
        principle: >
          法律的作用是让行为可预期。可预期才有合作。
          权利与义务成对出现，去掉一边另一边就变成特权或负担。
        model: 规则的价值在于降低不确定性，而不在于道德高度。
        exit: 能举一个“只谈权利不谈义务会出问题”的例子。
        video:
          q: [七年级 道德与法治 法律 权利 义务]
          c: [smartedu]

      - id: mid-civ-02
        title: 供求与价格
        grade: 八年级
        core: true
        strand: system
        kid: 一样东西买的人多、卖的少，就贵；反过来就便宜。
        principle: >
          价格是供需相遇的结果，同时又是下一次供给与需求的信号。
          这就是反馈：结果反过来改变原因。
        model: 反馈回路是理解经济、生态与控制的公共语言。
        exit: 能画出一个“涨价导致更多人种、最后又跌价”的回路。
        video:
          q: [初中 道德与法治 价格 供求 关系, supply and demand explained]
          c: [smartedu, khan-zh]

      - id: mid-civ-03
        title: 逻辑与辩证
        grade: 九年级
        core: true
        strand: cause
        kid: 讲道理要有根据。同一个人身上可以有互相矛盾的两面，不同时候看不一样。
        principle: >
          论证有效性来自前提为真与推理形式正确两件事，缺一件结论就不成立。
          辩证看问题是补充视角，不是取消真假判断。
        model: 分清“视角不同”与“事实不同”，才能既不被立场骗，也不陷入相对主义。
        exit: 能把一个论断拆成前提与结论，并指出哪条前提最可疑。
        video:
          q: [九年级 道德与法治 辩证思维 逻辑 论证]
          c: [smartedu]
