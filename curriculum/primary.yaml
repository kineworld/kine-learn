# 小学 · 1-6 年级
#
# 写法约定（全仓库一致，validate.py 会检查）：
#   kid       一年级版：极简直白，句子短，用身边的东西打比方。允许不严谨。
#   principle 第一性原理：这一条最根本的那句话。去掉它，后面的内容就散架。
#   model     与世界模型／勘境的连接：这条知识在"理解世界如何运作"里担任什么角色。
#   exit      出口标准：不是"学过"，而是能不看答案做出来、讲出来。
#   from      这一条从哪个知识点推出来（引用 id）。只对主干要求。
#   axiom     true 表示这一条当作给定的事实，不再往下追问——推导链的起点。
#             from 与 axiom 二选一，不能同时出现。
#   video     q 是检索关键词（拼成永不失效的检索链接）；c 是 data/links.yaml 里的资源 key。

stage_id: primary

units:
  # ================================================================ 数学
  - subject_id: math
    why: >
      小学数学只有一件事：把“看得见的东西”翻译成“能算的东西”，再翻译回去。
      习惯不好时，孩子会以为数学就是记规则——那正是后面学不动的真正原因。

    points:
      - id: pri-math-01
        title: 数与计数
        grade: 一年级
        core: true
        strand: number
        axiom: true
        kid: 数东西的时候，用手指一个一个点过去，点到最后那个数，就是“一共有几个”。
        principle: >
          “有多少”这件事，不数也能判断：把两堆东西一对一摆好，谁剩下，谁就多；
          两边都不剩，就是一样多。数只是给“一样多”这件事起的名字——
          名字不是东西，它只是那个配对结果的简称。
          这一条是整条数学链的起点，到此不再往下追问，把它当作给定的事实：
          世界里的东西可以一个一个拿出来，摆成配对。
          它配得上当起点，是因为它给的是一个能反复使用的判断——
          只要配对规则一样，谁来做、什么时候做，答案都一样。
          后面所有的“算”，都只是这条判断的加速版本。
        model: 世界模型的第一层也只做一件事——把眼前的情形压成几个数。压不出来，后面全免谈。
        exit: 能数清 20 个东西，并说清“第 3 个”和“3 个”哪里不一样。
        video:
          q: [一年级 数学 数一数 微课, counting to 20 for kids]
          c: [smartedu, khan-zh]

      - id: pri-math-02
        title: 加减乘除与位值
        grade: 一至三年级
        core: true
        strand: number
        from: pri-math-01
        kid: 加是把两堆合起来，减是拿走一堆。十个手指头不够用，就往左边写一位，左边一格顶十个。
        principle: >
          要数很大的数，一位一位数下去会数到崩溃，所以在计数之上必须先做一件事：
          把十个打包成一组。打包之后，一个符号的含义由它站的位置决定——
          同样是“3”，站在个位是 3 个，站在十位是 3 包，也就是 30。
          这一条从“数与计数”推出来：既然数只是配对结果的简称，
          那么只要打包规则固定，简称就可以按位置反复复用，
          于是无限多的数只需要十个符号，不必一数一个新名字。
          代价是：用位置表示数量，必须同时约定从哪边数起，否则两句话说的不是同一个数。
        model: 用有限符号表示无限情形，是一切表示法的共同难题，数字是人类的第一个成功答案。
        exit: 会做进位加与退位减，并能解释为什么同一个“3”写在十位上就大十倍。
        prereq: [pri-math-01]
        video:
          q: [一年级 数学 进位加法 讲解, place value tens and ones]
          c: [smartedu, khan-math]

      - id: pri-math-03
        title: 分数与小数
        grade: 三年级
        core: true
        strand: number
        from: pri-math-02
        kid: 一块饼切成 4 份，吃 1 份就是四分之一。切得越多，每份越小，合起来还是那块饼。
        principle: >
          减法会遇到一个尴尬：3 个苹果分给 4 个人，“一个一个数”的办法算不出答案。
          出路是换个问法——不问“有几个”，而问“把一个整体分成多少份、取走了多少份”。
          分母是分成的份数，分子是取走的份数，这两个信息合起来就唯一确定了一个量。
          这一条从“加减乘除与位值”推出来，用的是同一个动作：打包。
          区别只在于这次打包的单位不是“十”，而是“整体被分成的份数”。
          由此得到一条反直觉但成立的结论：分母越大，每一份越小；
          所以 1/3 比 1/4 大——比的是每一份的大小，不是分母那个数字。
        model: 把整体切成可比较的份，是“归一化”的雏形。模型里所有可比性都来自某种归一化。
        exit: 会画图比较 1/3 与 1/4，并说清为什么分母大的反而小。
        video:
          q: [三年级 数学 分数的初步认识, fractions for kids visual]
          c: [smartedu, khan-math]

      - id: pri-math-04
        title: 图形与度量
        grade: 二至五年级
        core: false
        strand: number
        kid: 长度用小尺子量，面积用方块铺满数格子。同样多的水倒进细杯子会显得高，其实没变多。
        principle: >
          长度是一维、面积是二维、体积是三维。度量必须先统一单位，否则两个数不可比。
        model: 度量是“把世界映射成数”的第一步，也第一次出现“换个坐标系，事实不变”。
        exit: 能举例说明周长变大不等于面积变大。
        video:
          q: [三年级 数学 面积 单位, area and perimeter difference]
          c: [smartedu, phet]

      - id: pri-math-05
        title: 比例与百分数
        grade: 六年级
        core: true
        strand: number
        from: pri-math-03
        kid: 买 2 个 8 元，买 4 个就该 16 元。百分号就是把“一百份里的几份”写短一点。
        principle: >
          分成等份之后会出现一类新问题：两份东西里，谁的“每一份”更大。
          直接比总数没有意义——买 2 个 8 元、买 4 个 16 元，说的是同一件事。
          把“每一份是多少”单独拎出来比较，就是在比比例；
          百分号只是把分母统一成 100 之后，省掉“每一百份里”这半句话。
          这一条从“分数与小数”推出来：比例就是分数用在两组量之间的对照，
          它成立的隐含前提是“份与份之间保持同步变化”。
          这个前提一旦不成立，外推就会出错——先涨价再打折不等于原价，
          正是因为两次变化的基准已经不同了。
        model: 外推能力来自结构假设。世界模型能预测没见过的未来，根子上是同一条。
        exit: 会用“每份多少”算任意份数，并能说清为什么先涨价再打折不等于原价。
        prereq: [pri-math-03]
        video:
          q: [六年级 数学 百分数 折扣, ratios and percentages basics]
          c: [smartedu, khan-math]

      - id: pri-math-06
        title: 用字母表示数
        grade: 五年级
        core: true
        strand: symbol
        from: pri-math-01
        kid: 一个还不知道的数，先给它起个名字叫 x，等以后再算出来。x 像一个空盒子，谁都能放进去。
        principle: >
          数这个概念本身就是符号：“3”不是三个苹果，是三个苹果共享的那个模式。
          既然符号能代表已经数清的量，它当然也能代表还没数清、甚至根本不打算数的量。
          于是“某数乘 3 再加 2 等于 11”这样一句话，可以写成一行式子，
          解出这一行，等于同时回答了无穷多个同类问题。
          这一条从“数与计数”推出来：它没有引入任何新东西，
          只是把“给数量起名字”这件事，从已知的名字推广到未知的名字。
          代价要说清：符号本身没有内容，式子列对不代表问题问对了，这一层要靠人负责。
        model: 泛化写法让一个结论覆盖无穷多情形，这是“模型”与“记录”的分界线。
        exit: 能把“某数乘 3 再加 2 等于 11”写成式子并解出来。
        video:
          q: [五年级 数学 用字母表示数, algebra basics variables]
          c: [smartedu, khan-math]

  # ================================================================ 语文
  - subject_id: chinese
    why: >
      语文在小学的任务不是作文分，是“把意思准确地搬进别人脑子”。
      这件事做不好，以后所有学科都会以“读不懂题”的形式还回来。

    points:
      - id: pri-chn-01
        title: 字形与部首
        grade: 一至二年级
        core: true
        strand: symbol
        axiom: true
        kid: 汉字像小图画拼起来的。“氵”三点是水，所以江、河、湖都跟水有关。
        principle: >
          汉字的数量庞大，但零件有限：一批偏旁提示意思（形旁），一批提示读音（声旁），
          还有一小批是剩下那些。绝大多数常用字是“一个形旁加一个声旁”拼出来的。
          所以识字可以拆成两步：先认出零件，再按位置拼回去。
          这一条当作给定的事实，不再往下追问：写下来的字和口头说的词之间有稳定的对应关系。
          从它出发能得到一个实用的判断：见到不认识的字，
          可以从形旁猜它大概属于哪一类事物，从声旁猜它大概怎么读。
          但这只能猜出方向，不能当成结论——零件提示的是范围，不是答案。
        model: 用少量零件组合出大量对象，是“生成式表示”最早的范例。
        exit: 见到不认识的字，能说出它大概跟什么有关。
        video:
          q: [一年级 语文 偏旁部首 识字, 汉字 形声字 讲解]
          c: [smartedu, zdic]

      - id: pri-chn-02
        title: 朗读与标点
        grade: 一至三年级
        core: false
        strand: symbol
        kid: 读句子要像说话一样停顿，逗号停一下，句号停久一点，问号声音往上走。
        principle: 标点是呼吸的记号。读得顺，说明你把句子正确切分了。
        model: 切分是理解的第一步。长句读不懂，常常不是词不认识，是层级切错了。
        exit: 能照着标点的停顿朗读一段话，并说出每处标点为什么在那里。
        video:
          q: [小学 语文 朗读 停顿 标点符号 微课]
          c: [smartedu]

      - id: pri-chn-03
        title: 句子的骨架
        grade: 二至四年级
        core: true
        strand: symbol
        from: pri-chn-01
        kid: 一句话常常是“谁 + 做什么”。先找到这两个，句子就站起来了。
        principle: >
          汉字既然能拆成零件，句子也能，用的是同一个动作：把整体拆开，再看零件怎么拼。
          一句话里真正撑住意思的只有两三个部分：谁（主语）、做什么（谓语），
          再加上被作用的对象（宾语）。剩下的“什么时候、在哪里、怎么样”都是挂件，
          去掉不伤主干的成立。
          这一条从“字形与部首”推出来：它没有提出新方法，
          只是把拆零件的动作从“字”这一层换到“句”这一层。
          由此得到读长句的办法：先删到只剩主干，删完这句话仍然说得通，才算真读懂了它。
        model: 找骨架就是抽主干，与从一堆输入里提取状态是同一件事。
        exit: 能把一个长句删成只留主干，且意思不矛盾。
        video:
          q: [小学 语文 缩句 主谓宾 讲解]
          c: [smartedu]

      - id: pri-chn-04
        title: 段落与复述
        grade: 三至五年级
        core: true
        strand: symbol
        from: pri-chn-03
        kid: 一段话讲一件事。读完一段，用自己的话说一句“这段讲了什么”。
        principle: >
          一段话通常只讲一件事。要检验自己有没有读懂，就把它压短：
          先按骨架删掉修饰，再把几个骨架句合成一句，看原来的意思还在不在。
          这一条从“句子的骨架”推出来：压缩的动作和缩句是同一个，
          区别只在这次要压缩的不再是句子内部，而是句子之间。
          压缩必然有损失，所以不能只说“大意是什么”，还要说出丢掉了什么。
          判据很简单：丢掉之后主旨仍然成立的，是细节；
          丢完主旨就变了的，那是主干，不能丢。
        model: 摘要就是有损压缩。世界模型对状态的提取，同样是一边丢细节、一边保住预测力。
        exit: 读完一篇课文，能用三句话说清全篇，并指出自己省掉了哪些细节。
        video:
          q: [小学 语文 概括 段落大意 方法]
          c: [smartedu]

      - id: pri-chn-05
        title: 比喻与说明
        grade: 三至六年级
        core: true
        strand: cause
        from: pri-sci-01
        kid: “月亮像盘子”是比喻，因为月亮不是盘子，只是像。“水到 100 度会开”是说明，因为它就是真的。
        principle: >
          读一段话，要能分清它在说哪一件事：是在说“它像什么”，还是在说“它是什么”。
          “月亮像盘子”只主张两者共享一个形状关系，不主张月亮是盘子；
          “水到 100 度会开”则是一条能被检验的事实陈述。
          这一条从“观察与记录”推出来：区分“我看到什么”和“我以为是什么”，
          与区分“是”和“像”，是同一个动作出现在两个场合。
          代价要说清：比喻越顺手越危险——它带来的理解是真的，它带来的证据是假的。
        model: 类比能迁移结构，也能伪造证据。任何解释都要能分成“像”和“是”两类。
        exit: 能在一篇科普文章里圈出所有比喻，并各说一句“它像在哪儿、不像在哪儿”。
        video:
          q: [小学 语文 比喻 拟人 说明方法]
          c: [smartedu]

  # ================================================================ 英语
  - subject_id: english
    why: >
      小学英语只需要做到一件事：把声音和东西直接连起来，中间不要过中文。
      过了中文，语速一快就断。这是后来听力差的最常见原因。

    points:
      - id: pri-eng-01
        title: 字母与发音（自然拼读）
        grade: 一至二年级
        core: true
        strand: symbol
        axiom: true
        kid: 英语单词是用字母的“声音”拼出来的，看到 cat 就知道怎么读。
        principle: >
          英语单词由有限的字母拼出来，而字母在词里对应的是“声音”，不是它的字母名。
          所以看到一个没见过的词，可以从字母与字母组合读出它的声音来。
          这一条当作给定的事实，不再往下追问：英文的拼写和读音之间确实存在规律。
          但这条规律只是大部分情况下成立：同一组字母在不同词里可以读得不同，
          最常见的那些词里也攒下了足够多的例外。
          所以正确的用法是先拼读、再验证，并且能说出自己不确定的是哪一部分——
          规律的作用是缩小猜测范围，不是保证猜对。
        model: 任何映射法则都有例外。知道法则的适用边界，比知道法则本身更重要。
        exit: 能拼读没见过的简单词，并说出自己不确定的那些。
        video:
          q: [小学 英语 自然拼读 字母组合, phonics for beginners]
          c: [smartedu, khan-zh]

      - id: pri-eng-02
        title: 高频词与基本句型
        grade: 一至三年级
        core: true
        strand: symbol
        from: pri-eng-01
        kid: 英语里最常用的词就那几百个，先学会它们，就能说很多话。
        principle: >
          英语里的词，有用程度差别极大：最常用的几百个覆盖了日常句子的绝大部分，
          剩下几万个合起来只占一小部分。
          既然字母组合能读出声音，那真正要一个一个记的，其实是“哪个声音对应哪个意思”。
          记忆量有限，就该先花在覆盖面积最大的那批词上。
          这一条从“字母与发音”推出来：拼读解决“怎么读出来”，
          高频词解决“先读哪些”——前者划出范围，后者定出顺序。
          代价也要说清：高频词说得顺，不代表能读文章；
          反过来，阅读量足够时高频词会被自然吸收，不必专门背。
        model: 长尾分布是世界的常见形状。把力气花在头部，是通用的效率原则。
        exit: 能用 100 个高频词说清今天做了什么。
        video:
          q: [小学 英语 高频词 句型, sight words practice]
          c: [smartedu, khan-zh]

      - id: pri-eng-03
        title: 时态的直觉
        grade: 三至六年级
        core: true
        strand: change
        from: pri-soc-01
        kid: 已经发生的事加 -ed，正在发生的事加 -ing，还没发生的用 will。
        principle: >
          说一件事之前，先要确定它落在时间线上的哪个位置。
          动词的形式（-ed、-ing、will）只是把这个位置写出来，不是另一套要背的规则。
          这一条从“时间与历法”推出来：给事件排先后、给时间点编号，
          是一切“什么时候”的陈述的共同前提；给动词盖时间戳是它在语言里的实现。
          由此得到一条实用的顺序：先画时间线，再把形式填进去。
          顺序反了会出现那种症状——每个形式都背过，一开口还是选错。
        model: 时间是状态序列的坐标。给状态打时间戳，才能谈“预测”这个词。
        exit: 能画一条时间线，把一件过去的事、正在做的事、将要做的事各放一个位置。
        video:
          q: [小学 英语 一般过去时 一般将来时 讲解, English tenses for kids]
          c: [smartedu, khan-zh]

      - id: pri-eng-04
        title: 听说先于读写
        grade: 一至六年级
        core: true
        strand: symbol
        axiom: true
        kid: 先听懂一句话，再学着说这句话，最后才写下来。顺序反了会很吃力。
        principle: >
          语言能力按固定顺序长出来：先听见，再听懂，再能说出来、读出来，最后才写得像样。
          听和读是输入，说和写是输出；输出只能从已经理解的输入里拼出来。
          这一条当作给定的事实，不再往下追问：这是儿童学母语的顺序，
          也是成年人学第二语言时反复踩进同一个坑的地方——输入量不够，
          输出就只能靠翻译，而且永远慢一拍。
          它的代价要说清：这是顺序，不是禁令。一开始就写不算错，
          把“背单词书”当成主要输入才算错。
        model: 先有观察，才有预测。输入不足的模型只能背答案，不能生成。
        exit: 能听懂一段三句话的日常对话，并原样复述。
        video:
          q: [小学 英语 听力 跟读 每日练习, daily English listening for kids]
          c: [smartedu, khan-zh]

  # ================================================================ 科学
  - subject_id: science
    why: >
      小学科学不是提前学物理化学，而是练两件事：把观察写下来，以及区分
      “我看到什么”和“我以为是什么”。这两件事是全部科学研究的地基。

    points:
      - id: pri-sci-01
        title: 观察与记录
        grade: 一至三年级
        core: true
        strand: cause
        axiom: true
        kid: 看一盆豆子每天长多少，量一量写在本子上。写下来才算知道，记在脑子里会骗自己。
        principle: >
          人对“昨天看到什么”的记忆并不可靠：后来的想法会悄悄并进当初的印象里，
          而且自己察觉不到。所以观察必须留下当场的记录——
          写下日期、写下数量、写下怎么做的，让另一个人能照着复查一遍。
          这一条当作给定的事实，不再往下追问：能被复查的才算证据，不能复查的只是印象。
          它是整个科学方法最小的版本，也是本材料全部证据规则的源头。
          从它出发，凡是“我觉得”“我记得”在结论里一律降级成待验证。
        model: 没有记录的观察不能作为证据。这是本组织全部证据规则的最小版本。
        exit: 连续记录同一个东西七天，每天一个数，并能画出它变化的走向。
        video:
          q: [小学 科学 观察记录 实验日记, science observation for kids]
          c: [smartedu, phet]

      - id: pri-sci-02
        title: 物质的三态
        grade: 二至四年级
        core: true
        strand: structure
        axiom: true
        kid: 冰化了变水，水烧开变汽。东西没变，只是它的小颗粒站得松了、跑得快了。
        principle: >
          冰、水、水蒸气是同一种东西，区别只在它那些极小的颗粒挨得多紧、跑得多快。
          加热给的是颗粒运动的剧烈程度，不是物质本身；
          运动够剧烈就会挣脱原来的排列，于是固体变液体、液体变气体，反过来就倒回去。
          这一条当作给定的事实，不再往下追问：物质由极小的、一直在运动的颗粒组成。
          它的价值在于它是一个示范——整体上看到的变化（硬变软、立变摊），
          可以由局部单元各自的简单规则推出来。这是“从局部规则推出整体现象”的第一课。
          代价是：小学阶段只能这样讲清它，还算不动它；
          要到中学有了温度与热量这两个量，才谈得上算。
        model: 宏观行为可以从微观单元的运动规则推出来。这是“从局部规则到整体现象”的第一课。
        exit: 能说清水结冰后为什么体积反而变大。
        video:
          q: [小学 科学 水的三态变化, states of matter for kids]
          c: [smartedu, phet]

      - id: pri-sci-03
        title: 力与运动（推、拉、摩擦）
        grade: 二至四年级
        core: true
        strand: energy
        axiom: true
        kid: 推小车它就动，不推它就慢慢停。地面越粗糙，停得越快。
        principle: >
          运动的东西会自己慢下来，看起来像“动完就停”。但这不是物体自己的脾气：
          小车停下，是因为地面在往后拉它；地面越粗糙，拉得越狠，它停得越快。
          把“推力”和“阻力”分开，才看得见真相——物体本身没有停下来的倾向，
          是阻力一直在扣它的速度，扣到零为止。
          这一条当作给定的事实，不再往下追问：每一个力都要能指出是谁给的、朝哪个方向。
          用法是：遇到任何“为什么会变”，先把所有在起作用的方向都找出来，
          再看它们的合力效果。少找一个方向，结论就会反过来。
        model: 分清“作用”与“阻力”，是理解一切运动变化的前提。
        exit: 能预测同一辆车在光滑地面和粗糙地面哪边走得远，并说出理由。
        video:
          q: [小学 科学 摩擦力 实验, force and motion for kids]
          c: [smartedu, phet]

      - id: pri-sci-04
        title: 光与影、昼与夜
        grade: 一至三年级
        core: false
        strand: scale
        kid: 光走直线，挡住就出影子。地球自己转圈，转过太阳这边是白天，转过那边是黑夜。
        principle: >
          影子的形状由光源与遮挡物的几何关系决定。
          昼夜不是太阳在动，是我们在转——同一现象两种说法，只有一种与观测一致。
        model: 换参照系能解释同一现象，但只有能预测新观测的那个才是正确的。
        exit: 能用一盏灯和一个球演示昼夜，并预测把手电向左移影子往哪边动。
        video:
          q: [小学 科学 影子 光的直线传播, day and night for kids]
          c: [smartedu, phet]

      - id: pri-sci-05
        title: 生物与环境（食物链）
        grade: 三至六年级
        core: true
        strand: system
        from: pri-sci-03
        kid: 兔子吃草，狐狸吃兔子。少了一样，一整串都会乱。
        principle: >
          食物链不是“谁吃谁”的名单，是一条单向的运输带：
          草存下来的东西被兔子吃走，兔子身上的又被狐狸吃走。
          每经过一层，大部分被这一层自己的消耗花掉了，只剩很少一点传下去。
          这一条从“力与运动”推出来，用的是同一条更基本的事实——
          推出去的东西不会白回来。摩擦把运动扣成热散进环境里；
          每一层生物把食物扣成自己的消耗与热，同样是散出去。
          所以顶层的数量天然不可能多：不是“剩下的不够吃”，是运输带每层都要扣掉大部分。
          由此得到实用判断：抽掉中间一环，受影响的是整条带子的形状，而不只是邻居。
        model: 系统的连锁反应不是加法。抽掉一个环节，受影响的是整个网络的形状。
        exit: 能画出一条食物链，并说出抽掉中间一环后三种可能的后果。
        video:
          q: [小学 科学 食物链 食物网, food chain for kids]
          c: [smartedu, khan-science]

  # ================================================================ 社会与常识
  - subject_id: society
    why: >
      社会常识回答孩子最早问的那类问题：时间怎么走、路怎么认、钱为什么能用。
      这些是“世界为什么这样运行”的人造部分。

    points:
      - id: pri-soc-01
        title: 时间与历法
        grade: 一至三年级
        core: false
        strand: scale
        kid: 一天有 24 小时，一年有 365 天。日历是把日子排好队，好让大家说的话是同一个意思。
        principle: >
          历法是人为约定，用来给事件排先后。闰年是为了修补“天数不是整数”这个事实。
        model: 给事件编号，才能比较、排序、推测。时间戳是任何序列模型的前提。
        exit: 能算出两个月之间有多少天，并解释为什么会有闰年。
        video:
          q: [小学 数学 年月日 平年闰年]
          c: [smartedu]

      - id: pri-soc-02
        title: 地图与方位
        grade: 二至四年级
        core: true
        strand: scale
        axiom: true
        kid: 地图就是从上往下看的照片，缩小了很多倍。地图上北边通常朝上。
        principle: >
          地图是把三维的世界按固定比例压到一张平面上的结果。既然是“压”，就一定丢东西：
          高度被拍平了，弯曲被拉直了，比例尺在离得远的地方会失准。
          这一条当作给定的事实，不再往下追问：地图与真实地形之间是比例关系，不是等同关系。
          它的用法是反过来问：拿到一张图，先问它丢掉了什么、它是为哪一类问题画的。
          由此得到两条实操判断：两点之间的距离要按比例尺换算，不能凭感觉；
          图上量出的方向是平面上的方向，山路、航线、地铁换乘这类问题它答不了。
        model: 一切表示都是带损失的投影。知道损失在哪，才知道结论能用在哪。
        exit: 能根据地图说出两点间的方向与大概距离，并指出地图没告诉你的信息。
        video:
          q: [小学 数学 位置与方向 地图比例尺]
          c: [smartedu]

      - id: pri-soc-03
        title: 交换与货币
        grade: 三至六年级
        core: true
        strand: system
        axiom: true
        kid: 我有一支笔，你有一块橡皮，换着用都更好。钱是大家都认的“中间物”。
        principle: >
          两个人各自有自己不缺的东西，交换才成立。麻烦在于“你要的正好我有、
          我要的正好你有”这件事很难同时凑齐，人越多越难凑。
          货币的解法是把一次交换拆成两半：先把自己的东西换成谁都愿意认的中间物，
          再用中间物换到想要的东西。于是只需要两次“有人正好需要我的东西”，
          不必再等一次“双方正好互补”。
          这一条当作给定的事实，不再往下追问：一群人会共同承认某样中间物。
          它的代价要说清：中间物本身几乎不值钱，它值钱是因为别人也认——
          所以它怕的不是“用坏了”，而是“别人不认了”。
        model: 引入一个公共中介能大幅降低协调成本。这是系统设计的通用手法。
        exit: 能说清为什么有了钱，交易会变得容易，并指出钱本身不值钱在哪。
        video:
          q: [小学 道德与法治 货币 交换 是怎么来的, what is money for kids]
          c: [smartedu, khan-zh]
