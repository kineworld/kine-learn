# 大学基础 · 本科一至三年级
#
# 与中学最大的区别：这里不再给"够用就行"的公式，而是给定义，并要求你知道
# 每个定义为什么必须长成这样、删掉哪一条会坏掉什么。
# 勘境（kineworld）的贡献者，最低限度要过 calculus、linalg、probability、information 四条线。

stage_id: university

units:
  # ================================================================ 微积分
  - subject_id: calculus
    why: >
      微积分只回答两个问题：一件事变化得多快，以及把无数小变化加起来是多少。
      它之所以威力大，是因为所有光滑的东西在足够小的范围内都近似是线性的。

    points:
      - id: uni-cal-01
        title: 极限的严格定义
        grade: 大一
        core: true
        strand: scale
        kid: 极限不是“走到底”，而是“你说要多近，我就能让它多近”。
        principle: >
          极限用“任意给定的误差都能被满足”替代了“越来越接近”这种模糊说法。
          它把直觉换成了可检验的命题，这是现代分析的起点。
        model: 把模糊说法改写成可检验条件，是全部科学定义化的通用手法。
        exit: 能用误差语言说明一个数列收敛的确切含义，并指出“越来越接近”这种说法在哪里不够用。
        video:
          q: [高等数学 极限 定义 严格证明, epsilon delta limit intuition]
          c: [icourse163, ocw-1801, 3b1b]

      - id: uni-cal-02
        title: 导数与局部线性化
        grade: 大一
        core: true
        strand: change
        kid: 任何弯曲的东西，凑近看都是直的。
        principle: >
          可微意味着函数在一点附近可以用一条直线近似，误差比距离更高阶地小。
          求导就是一个“局部找最像的直线”的过程。
        model: 梯度下降的全部合法性来自局部线性化：能线性近似，才能指出往哪走能降低。
        exit: 能写出一个函数在某点的线性近似并说明误差量级。
        video:
          q: [高等数学 导数 微分 局部线性化, local linearization]
          c: [icourse163, ocw-1801, 3b1b]

      - id: uni-cal-03
        title: 泰勒展开
        grade: 大一
        core: true
        strand: scale
        kid: 用一串越来越小的修正项去拼一条曲线，拼得越多就越像。
        principle: >
          展开的每一阶都对应一个可测的局部性质：值、斜率、弯曲、弯曲的变化率。
          常见函数可以被多项式任意精度地逼近。
        model: 用简单函数逼近复杂函数，是数值计算与神经网络逼近定理的共同思想。
        exit: 能写出某个函数的前三阶展开并估计在某点的误差。
        video:
          q: [高等数学 泰勒公式 展开 应用, Taylor series intuition]
          c: [icourse163, ocw-1801, 3b1b]

      - id: uni-cal-04
        title: 积分与基本定理
        grade: 大一
        core: true
        strand: change
        kid: 把无数条细长条加起来就是积分；反过来，“一件东西累积了多少”的变化率就是它本身。
        principle: >
          微积分基本定理说明积分与微分互为逆运算。
          它的实际含义是：只要知道变化率，就能算出总量，不需要知道每个瞬间。
        model: 对偶算子（累积与瞬时）让许多问题在另一个域里变成简单问题。
        exit: 能解释为什么求面积可以不做任何“逐条相加”的动作。
        video:
          q: [高等数学 定积分 微积分基本定理 牛顿莱布尼茨]
          c: [icourse163, ocw-1801, 3b1b]

      - id: uni-cal-05
        title: 多元微积分与梯度
        grade: 大二
        core: true
        strand: structure
        kid: 山上每一点都有一个“最陡的上坡方向”，梯度就指这个方向。
        principle: >
          梯度是由所有偏导数组成的向量，指向函数增大最快的方向。
          梯度的方向与等高线垂直——这是“上升最快”与“不改变值”两个要求互相垂直。
        model: 优化全靠它。梯度为零是驻点，是极小、极大还是鞍点要看二阶信息。
        exit: 能对二元函数算梯度，并解释为什么沿梯度方向走函数值上升最快。
        video:
          q: [高等数学 偏导数 梯度 方向导数, gradient descent intuition]
          c: [icourse163, ocw-1801, 3b1b]

      - id: uni-cal-06
        title: 微分方程
        grade: 大二
        core: true
        strand: change
        kid: 只知道“变化快慢跟现在有多少有关”，也能推出以后会变成多少。
        principle: >
          微分方程给出局部规则，解给出全局行为。
          指数增长、振动、衰减都是同一类方程在不同参数下的样子。
        model: 世界模型最自然的写法就是学习一个离散化的微分方程。动力学建模的公共语言。
        exit: 能写出指数增长与简谐振动各自对应的微分方程并指出参数含义。
        video:
          q: [常微分方程 一阶 线性 通解, differential equations intuition]
          c: [icourse163, ocw-1801, 3b1b]

  # ================================================================ 线性代数
  - subject_id: linalg
    why: >
      线性代数研究“保持加法和数乘的变换”。它重要，是因为非线性问题在局部可以线性化，
      以及因为它是唯一一门能被彻底搞清楚的高维几何。

    points:
      - id: uni-lin-01
        title: 向量空间与基
        grade: 大一
        core: true
        strand: structure
        kid: 一堆箭头可以互相拼出别的箭头，能拼出的全部就叫一个空间。
        principle: >
          基是能表示空间中一切向量的一组最小的向量。同一个向量在不同基下坐标不同，
          但向量本身没变——坐标是描述，不是对象。
        model: 区分“对象”与“描述”，是表示学习的核心。换基就是换一组特征。
        exit: 能判断一组向量是否线性无关，并说明它能不能作为某个空间的基。
        video:
          q: [线性代数 向量组 线性相关 基 维数, linear independence basis]
          c: [icourse163, ocw-1806, 3b1b]

      - id: uni-lin-02
        title: 线性变换与矩阵
        grade: 大一
        core: true
        strand: structure
        kid: 矩阵不是一张数字表，是一个动作：把箭头拉长、压扁、转身。
        principle: >
          矩阵是线性变换在给定基下的坐标记录。矩阵乘法的规则就是“先做一个再做另一个”，
          所以它一般不满足交换律。
        model: 把运算当作变换而不是数表，才能理解为什么非线性层是必要的。
        exit: 能说出一个 2 乘 2 矩阵把单位方格变成什么形状，并解释行列式的意义。
        video:
          q: [线性代数 线性变换 矩阵 几何意义, linear transformations matrices 3blue1brown]
          c: [icourse163, ocw-1806, 3b1b]

      - id: uni-lin-03
        title: 行列式与可逆性
        grade: 大一
        core: true
        strand: structure
        kid: 行列式量的是“这个动作把面积放大了几倍”。如果是零，说明它把空间压扁了，回不去。
        principle: >
          行列式为零等价于变换不可逆，等价于存在非零向量被映射到零，等价于列向量线性相关。
          这串等价关系是线性代数里最值钱的一句话。
        model: 不可逆意味着信息丢失。可辨识性与可逆性在数学上是同一件事的两种说法。
        exit: 能说明为什么奇异矩阵没有逆，并举出一个具体的例子。
        video:
          q: [线性代数 行列式 逆矩阵 秩, determinant inverse matrix]
          c: [icourse163, ocw-1806, 3b1b]

      - id: uni-lin-04
        title: 特征值与特征向量
        grade: 大一
        core: true
        strand: change
        kid: 有的方向被拉伸后方向不变，只是变长变短。这样的方向最特殊，叫特征方向。
        principle: >
          特征向量给出变换的不变方向，特征值给出该方向的伸缩倍数。
          在特征基下，复杂的重复变换变成各方向独立缩放，迭代就变得极易计算。
        model: 迭代系统的长期行为由最大特征值主导。理解长期趋势只需要看一个数。
        exit: 能算出一个矩阵的特征值，并说出它反复作用很多次后结果会往哪个方向偏。
        video:
          q: [线性代数 特征值 特征向量 对角化, eigenvectors intuition]
          c: [icourse163, ocw-1806, 3b1b]

      - id: uni-lin-05
        title: 内积、正交与投影
        grade: 大一
        core: true
        strand: number
        kid: 投影就是“影子”。把一个东西投到某个方向上，剩下的部分跟那个方向垂直。
        principle: >
          内积定义了长度与角度，从而定义了“垂直”与“最近”。
          最小二乘就是用投影求一个不可解方程组的最优近似解。
        model: 有内积才有距离，有距离才有“最近”，有最近才有学习。损失函数的地基在这里。
        exit: 能推导最小二乘的正规方程，并说明它为什么是投影的另一种写法。
        video:
          q: [线性代数 内积 正交 投影 最小二乘, least squares projection]
          c: [icourse163, ocw-1806, 3b1b]

      - id: uni-lin-06
        title: 奇异值分解
        grade: 大二
        core: true
        strand: structure
        kid: 任何拉伸压缩的动作，都可以拆成“转身、拉长、再转身”三步。
        principle: >
          奇异值分解把任意矩阵写成旋转、对角缩放、旋转的乘积。
          奇异值的大小直接说明这个变换在各个方向上放大了多少，也说明有多少信息被丢掉。
        model: 判断一个表征是否坍缩，看的就是它的奇异值谱。这是本组织表征健康度探针的数学来源。
        exit: 能说明一个矩阵的奇异值全部很小时意味着什么，以及它为什么表示信息丢失。
        video:
          q: [线性代数 奇异值分解 SVD 应用, singular value decomposition intuition]
          c: [icourse163, ocw-1806, 3b1b]

  # ================================================================ 概率与统计
  - subject_id: probability
    why: >
      概率是唯一一门能同时容纳“不知道”和“算得清”的语言。
      不会概率的人只能给出确定答案，而世界的多数问题没有确定答案。

    points:
      - id: uni-pro-01
        title: 概率公理与条件概率
        grade: 大二
        core: true
        strand: cause
        kid: “在已经知道某事的前提下，另一件事发生的概率”跟原来不一样，这就是条件概率。
        principle: >
          概率是对一组事件的度量，满足三条基本规则。条件概率是重新划定样本空间后的度量。
          独立是乘积成立，不是“毫无关系”这种模糊说法。
        model: 观测会改变信念。任何“我知道多少”都必须写成条件。
        exit: 能算出两个不独立事件的联合概率，并说明独立假设在这里为什么错。
        video:
          q: [概率论 条件概率 独立性 全概率公式, conditional probability]
          c: [icourse163, khan-math]

      - id: uni-pro-02
        title: 贝叶斯公式
        grade: 大二
        core: true
        strand: cause
        kid: 体检查出阳性，不等于一定有病，要看这种病本来有多常见。
        principle: >
          后验正比于似然乘先验。忽略先验会得出荒谬结论——
          这就是为什么罕见病的阳性结果多数是假阳性。
        model: 更新信念的标准公式。先验就是模型原有的假设，数据只做修正。
        exit: 能算出一个罕见病检测的阳性预测值，并说明为什么它低得反直觉。
        video:
          q: [概率论 贝叶斯公式 先验 后验, Bayes theorem intuition]
          c: [icourse163, khan-math, 3b1b]

      - id: uni-pro-03
        title: 随机变量与分布
        grade: 大二
        core: true
        strand: change
        kid: 把每种结果配上发生的可能，再配上数值，就能算平均和波动。
        principle: >
          分布完整描述了随机变量，期望与方差只是它的两个摘要。
          只报这两个数字，等于用两张照片代替一个立体对象。
        model: 摘要统计不是分布。模型评估里“均值加误差棒”经常掩盖关键的多峰或长尾结构。
        exit: 能构造两个期望方差相同但形状完全不同的分布。
        video:
          q: [概率论 随机变量 分布函数 期望 方差, random variables distributions]
          c: [icourse163, khan-math]

      - id: uni-pro-04
        title: 大数定律与中心极限定理
        grade: 大二
        core: true
        strand: scale
        kid: 扔硬币次数越多，正面比例越接近一半；而“偏离一半的量”自己有个固定的形状。
        principle: >
          大数定律说样本均值收敛到期望；中心极限定理说波动部分的分布趋近正态，
          且与原本的分布形状无关。
        model: 这是“大量独立小因素相加”能普遍用正态描述的原因，也是统计推断的合法性来源。
        exit: 能解释为什么误差往往近似正态，即使原始量完全不是正态分布。
        video:
          q: [概率论 大数定律 中心极限定理 应用, central limit theorem]
          c: [icourse163, khan-math, 3b1b]

      - id: uni-pro-05
        title: 估计与置信区间
        grade: 大二
        core: true
        strand: cause
        kid: 用一小部分数据猜整体，猜出来的数一定有余地，这个余地就是区间。
        principle: >
          置信区间的含义是“这套造区间的办法在长期里有百分之九十五的概率覆盖真值”，
          不是“真值有百分之九十五的概率落在本区间里”。
        model: 区间的解释是程序性质的，不是单次结果的。混淆两者是最常见的统计误读。
        exit: 能说出置信区间的正确解释，并指出常见错误说法错在哪。
        video:
          q: [数理统计 参数估计 置信区间 含义, confidence interval interpretation]
          c: [icourse163, khan-math]

      - id: uni-pro-06
        title: 假设检验与 p 值
        grade: 大二
        core: true
        strand: cause
        kid: p 值小只说明“如果本来没效果，出现这么极端的结果很难”，不代表效果大。
        principle: >
          p 值是“在零假设为真时观测到当前或更极端数据的概率”，不是“零假设为真的概率”。
          它同时受效应量与样本量影响，所以不能当效果大小的度量。
        model: 检验是决策程序，不是真值发现器。多重比较不做校正必然产出假阳性。
        exit: 能指出一个“p 小于 0.05 所以有效”的结论里缺了哪两样东西。
        video:
          q: [数理统计 假设检验 p值 误区, p value misinterpretation]
          c: [icourse163, khan-math]

  # ================================================================ 离散数学与计算
  - subject_id: discrete
    why: >
      计算机处理的是离散对象。这门课给的是“可计算的精确语言”，
      以及判断一个问题难到什么程度的能力。

    points:
      - id: uni-dis-01
        title: 集合、关系与函数
        grade: 大一
        core: true
        strand: structure
        kid: 关系就是“谁跟谁有关系”，比如“谁是谁的爸爸”。函数是一种特殊的关系。
        principle: >
          关系是笛卡尔积的子集，于是“传递”“对称”这些性质可以被精确定义与证明。
          等价关系把集合切成互不相交的块，这就是分类的数学形式。
        model: 分类、聚类、等价类在数学上是同一个结构。
        exit: 能判断一个给定关系是否满足自反、对称、传递，并说明它能否分类。
        video:
          q: [离散数学 集合 关系 等价关系 偏序]
          c: [icourse163, khan-computing]

      - id: uni-dis-02
        title: 图论
        grade: 大一
        core: true
        strand: structure
        kid: 点和线连起来就是图。谁跟谁连通，决定了消息能不能传过去。
        principle: >
          图把“关系”从“位置”里剥出来单独研究。连通性、最短路径、二分性、树的判定
          都是结构性质，与实际画法无关。
        model: 神经网络的连接结构、世界的状态转移图、依赖关系都是图。
        exit: 能判断一个图能否二染色，并说明这一性质在调度问题里有什么用。
        video:
          q: [离散数学 图论 连通性 树 最短路]
          c: [icourse163, khan-computing]

      - id: uni-dis-03
        title: 递归与计算复杂度
        grade: 大一
        core: true
        strand: scale
        kid: 一个办法要跑多久，跟事情变多快长大后有本质区别：有的慢一点，有的一下子就爆掉。
        principle: >
          复杂度描述的是增长的量级，忽略常数因子，因为规模一大常数就不重要了。
          指数与多项式之间的差距不是快慢问题，是可行与不可行的问题。
        model: 判断一个算法是否可行，先看量级。这条判断让很多实验免于白跑。
        exit: 能比较两个算法在输入规模翻倍时的工作量变化，并说出哪个在大规模下不可用。
        video:
          q: [算法 时间复杂度 大O 递归, big O notation]
          c: [icourse163, khan-computing]

      - id: uni-dis-04
        title: 可计算性与图灵机
        grade: 大二
        core: true
        strand: scale
        kid: 有些问题不是“还没想出来怎么算”，是原则上算不出来。
        principle: >
          图灵机给出了“可计算”的精确定义。停机问题不可判定，
          说明存在原则上无法用算法解决的问题——这与算力大小无关。
        model: 先问“这个问题可不可判定”，再问“能不能算得快”。顺序反了会浪费几年。
        exit: 能说明停机问题为什么不可判定，以及它与“程序查错器不存在”的关系。
        video:
          q: [可计算性 图灵机 停机问题 不可判定]
          c: [icourse163, khan-computing]

      - id: uni-dis-05
        title: 数值方法与浮点误差
        grade: 大二
        core: true
        strand: number
        kid: 电脑里的数只有有限多位，0.1 加 0.2 不一定刚好等于 0.3。
        principle: >
          浮点数是二进制下的有限表示，因此有舍入误差、上溢与下溢。
          两个很接近的大数相减会突然失去精度——这叫灾难性抵消。
        model: 一切数值实验都要问误差来源与量级。报告里位数写得越多不代表越准。
        exit: 能举出一个在浮点下不成立的算术事实，并说明结果该怎么报告。
        video:
          q: [数值分析 浮点数 误差 稳定性]
          c: [icourse163, khan-computing]

  # ================================================================ 大学物理
  - subject_id: university_physics
    why: >
      大学物理把中学的“公式”换成“定律加适用条件”。
      判断掌握与否的方法是：能不能说出这个定律在什么情况下失效。

    points:
      - id: uni-phy-01
        title: 质点力学
        grade: 大一
        core: true
        strand: change
        kid: 只要知道受力，就能推出以后怎么动。反过来，观察到怎么动就能推出受力。
        principle: >
          牛顿方程是二阶微分方程，给定初始位置与初始速度才有唯一解。
          也就是说“现在”不够，还要知道“变化的方向”。
        model: 状态必须包含足够的信息才能唯一决定未来。这是马尔可夫状态的定义性要求。
        exit: 能说明为什么一阶状态描述不足、必须给出初始速度。
        video:
          q: [大学物理 质点力学 牛顿方程 初始条件]
          c: [icourse163, mit-ocw, openstax]

      - id: uni-phy-02
        title: 刚体转动
        grade: 大一
        core: false
        strand: structure
        kid: 转的东西不容易停下来，而且转得越开越难停。
        principle: >
          转动惯量相当于平动的质量，力矩相当于力。整套平动公式有转动版本，
          因为数学结构相同。
        model: 结构相同的方程可以整体迁移，这是类比推理最可靠的用法。
        exit: 能说出转动惯量取决于什么，并解释花样滑冰收臂为什么会加速旋转。
        video:
          q: [大学物理 刚体 转动惯量 角动量守恒]
          c: [icourse163, mit-ocw, openstax]

      - id: uni-phy-03
        title: 振动与波
        grade: 大一
        core: true
        strand: change
        kid: 被拉开的弹簧会来回动，因为它被拉得越远，往回拉的力越大。
        principle: >
          回复力与位移成正比就得到简谐振动，此时方程是线性的。
          线性使它有叠加性，于是任何复杂的振动都能拆成简单振动之和。
        model: 线性系统可分解，是最重要的结构性事实之一。它解释了为什么傅里叶方法到处能用。
        exit: 能写出简谐振动方程并说明周期由什么决定、与振幅无关。
        video:
          q: [大学物理 简谐振动 波动方程 叠加]
          c: [icourse163, mit-ocw, phet]

      - id: uni-phy-04
        title: 热力学定律与统计意义
        grade: 大二
        core: true
        strand: energy
        kid: 热量只会自己从热的地方跑到冷的地方，不会倒着跑。
        principle: >
          第一定律是能量守恒，第二定律给出过程方向。
          第二定律的统计解释是：宏观状态之所以从不均匀趋向均匀，
          只是因为均匀状态对应的微观排列数多得多——不是不可能倒过来，是概率极低。
        model: 这条统计解释改变了对“不可逆”的理解：它是概率的，不是禁止的。物理定律里第一次出现必然性只是近似。
        exit: 能解释为什么倒放热扩散不是被禁止而是极不可能，并估算它的量级。
        video:
          q: [热力学 第二定律 统计解释 熵, entropy statistical mechanics]
          c: [icourse163, mit-ocw, feynman]

      - id: uni-phy-05
        title: 麦克斯韦方程组
        grade: 大二
        core: true
        strand: energy
        kid: 四条式子把电和磁的所有事都写完了，还顺手说明了光是什么。
        principle: >
          四个方程描述电荷产生电场、变化磁场产生电场、磁单极不存在、电流与变化电场产生磁场。
          把它们联立会得到波动方程，波速由两个电磁学常数算出——正好等于光速。
        model: 两条彼此无关的实验常数，组合出光的速度，这种“意外吻合”是历史上最有力的理论证据。
        exit: 能说明为什么由此可以断定光就是电磁波，而不是恰好速度相同的东西。
        video:
          q: [电动力学 麦克斯韦方程组 电磁波 光速]
          c: [icourse163, mit-ocw, feynman]

      - id: uni-phy-06
        title: 光的干涉与衍射
        grade: 大二
        core: false
        strand: scale
        kid: 光绕过一个缝会散开，两条缝会互相叠成明暗条纹。
        principle: >
          条纹间距与波长成正比，因此可以用它测量极小的长度。
          光学干涉仪把“测长度”换成了“数条纹”，精度提升了几个数量级。
        model: 把难测的量转换成易测的量，是测量科学的核心技巧。
        exit: 能说明双缝条纹间距由哪些量决定，并解释它为什么能测波长。
        video:
          q: [大学物理 光的干涉 衍射 双缝干涉仪]
          c: [icourse163, mit-ocw, openstax]

      - id: uni-phy-07
        title: 狭义相对论
        grade: 大二
        core: true
        strand: scale
        kid: 光速对谁来说都一样快，这件事逼着我们改掉“时间对所有人都一样”的想法。
        principle: >
          两条假设（物理规律在一切惯性系相同、真空光速不变）推出时间膨胀、长度收缩、
          同时性的相对性。代价是放弃绝对时间。
        model: 一个反常的观测事实，如果不肯放弃某个“显然”的假设，就会一直被当成悖论。
        exit: 能说明同时性的相对性是怎么从光速不变推出来的。
        video:
          q: [大学物理 狭义相对论 光速不变 时间膨胀]
          c: [icourse163, mit-ocw, feynman]

      - id: uni-phy-08
        title: 量子假设与不确定性
        grade: 大二
        core: true
        strand: scale
        kid: 极小的东西，你越想知道它在哪儿，就越不知道它跑多快。
        principle: >
          不确定性不是仪器不行，是共轭量不可能同时确定，这是波的本性。
          能量量子化是实验逼出来的：不假设它，黑体辐射与原子光谱都算不对。
        model: 测量的极限来自理论本身而不是工具。知道极限在哪，才知道哪些目标不该定。
        exit: 能解释为什么“因为仪器精度不够”是错的解释。
        video:
          q: [大学物理 量子力学 不确定性原理 波粒二象性]
          c: [icourse163, ocw-804, feynman]

  # ================================================================ 理论力学
  - subject_id: mechanics
    why: >
      理论力学换了一套写法：不追踪力，而追踪能量。换写法之后，
      约束力自动消失，复杂问题变简单——这是“换表示”威力的经典展示。

    points:
      - id: uni-mec-01
        title: 拉格朗日力学
        grade: 大二
        core: true
        strand: change
        kid: 不用管绳子和轨道的拉力，只看“有多少种走法”，再从中挑出真正会走的那一条。
        principle: >
          用广义坐标描述系统，从动能减势能构造拉格朗日量，
          由变分原理导出运动方程。约束力因为不出现在广义坐标里而自动消失。
        model: 选对坐标，问题就解决了一半。表示的选择直接决定求解难度。
        exit: 能用拉格朗日方法写出一根摆的运动方程，并指出它比牛顿方法省掉了什么。
        video:
          q: [理论力学 拉格朗日方程 广义坐标, Lagrangian mechanics]
          c: [icourse163, mit-ocw]

      - id: uni-mec-02
        title: 最小作用量原理
        grade: 大二
        core: true
        strand: change
        kid: 光知道要抄近路，球知道要走最省力的一条路。
        principle: >
          真实路径使作用量取驻值（通常最小）。这条全局性的陈述，
          等价于牛顿的局部因果方程，但它允许一次考虑整条路径。
        model: 局部规则与全局极值原理互为等价写法。选择哪一种取决于问题结构。
        exit: 能说明为什么最小作用量原理与牛顿方程给出同一个结果。
        video:
          q: [理论力学 最小作用量原理 变分法]
          c: [icourse163, mit-ocw]

      - id: uni-mec-03
        title: 哈密顿力学与相空间
        grade: 大二
        core: true
        strand: structure
        kid: 把一个系统的位置和速度各画一根轴，它的状态就是这张图上的一个点。
        principle: >
          哈密顿方程把运动写成位置与动量的对称形式，状态演化对应于相空间中的流动。
          相空间体积守恒（刘维尔定理）是统计力学的入口。
        model: 状态空间视角：预测就是状态点沿确定性（或随机）流场的推进。世界模型的语言。
        exit: 能画出单摆的相图，并说出闭合曲线与开放曲线分别代表什么运动。
        video:
          q: [理论力学 哈密顿方程 相空间 相图, Hamiltonian phase space]
          c: [icourse163, mit-ocw]

      - id: uni-mec-04
        title: 对称性与守恒定律
        grade: 大二
        core: true
        strand: energy
        kid: 世界往哪个方向看都一样，所以转圈的东西会保持转下去。
        principle: >
          诺特定理：每一个连续对称性对应一个守恒量。
          时间平移对称对应能量守恒，空间平移对应动量守恒，旋转对应角动量守恒。
        model: 守恒律的来源不是“实验结果”，而是对称性。这条认识改变了物理学找规律的方式。
        exit: 能说出三种对称性各对应哪个守恒量，并解释为什么对称性能给出守恒。
        video:
          q: [理论力学 诺特定理 对称性 守恒量, Noether theorem symmetry conservation]
          c: [icourse163, mit-ocw]

  # ================================================================ 电动力学
  - subject_id: electrodynamics
    why: >
      电动力学是“场”的样板课。学完它，你会发现物理学里很多别的对象
      （引力、流体、甚至扩散）都在用同一套数学。

    points:
      - id: uni-ele-01
        title: 静电场与高斯定律
        grade: 大三
        core: true
        strand: energy
        kid: 把电荷装在盒子里，穿出盒面的电场总量只跟盒里装了多少电有关，跟盒子多大多小无关。
        principle: >
          高斯定律把电场与电荷的关系写成通量与源的形式，它只在有对称性时才好用来求场。
          场线始于正电荷、终于负电荷。
        model: 用积分守恒量求局部量，前提是够对称。判断对称性是选工具的第一步。
        exit: 能用高斯定律求出带电球面内外的电场，并说明为什么内部电场为零。
        video:
          q: [电动力学 静电场 高斯定理 应用]
          c: [icourse163, mit-ocw]

      - id: uni-ele-02
        title: 稳恒磁场与安培环路定理
        grade: 大三
        core: true
        strand: energy
        kid: 电流周围会有一圈一圈的磁力线，绕着电流转。
        principle: >
          安培环路定理把磁场的环量与穿过回路的电流联系起来。
          磁场是有旋无散的场，所以磁力线永远是闭合的——磁单极不存在。
        model: 区分“无散”（有源）与“无旋”（有势）是场论里最基础的一条分类。
        exit: 能说明为什么磁力线一定闭合，而电场线可以终止在电荷上。
        video:
          q: [电动力学 安培环路定理 稳恒磁场]
          c: [icourse163, mit-ocw]

      - id: uni-ele-03
        title: 电磁波与辐射
        grade: 大三
        core: false
        strand: energy
        kid: 电荷一旦加速，就会把能量甩出去，甩出去的东西就是电磁波。
        principle: >
          加速电荷产生辐射场，辐射功率与加速度的平方成正比。
          这条平方律解释了为什么天线要做成特定形状，以及为什么高频电路容易干扰别人。
        model: 平方律在物理里反复出现，它通常意味着“代价随速率急剧上升”，是设计约束的来源。
        exit: 能解释为什么无线电天线要有合适尺寸，以及为什么不能用低频信号远距离传输很高带宽。
        video:
          q: [电动力学 电磁波 辐射 天线]
          c: [icourse163, mit-ocw]

  # ================================================================ 量子力学
  - subject_id: quantum
    why: >
      量子力学是“用不可直接观测的表示对象做精确预测”的范本。
      它教的东西远超物理：如何对待一个无法直觉化的状态空间。

    points:
      - id: uni-qua-01
        title: 波函数与叠加
        grade: 大三
        core: true
        strand: scale
        kid: 一个东西在没被看之前，可以同时处于几种可能的混合状态。
        principle: >
          波函数是概率幅，不是概率。幅值可以相加产生干涉，
          概率只在取模平方后出现——这就是叠加与干涉的来源。
        model: 状态可以是分布而不是取值。用分布表示不确定性是量子力学对其它领域最大的输出。
        exit: 能说明为什么“同时处于两种状态”不等于“其实只是我们不知道”。
        video:
          q: [量子力学 波函数 概率幅 叠加态]
          c: [icourse163, ocw-804]

      - id: uni-qua-02
        title: 薛定谔方程
        grade: 大三
        core: true
        strand: change
        kid: 粒子怎么随时间变化，被这一个方程全说完了。
        principle: >
          方程是线性的，所以解可以叠加；解是复数的，所以有相位与干涉。
          定态对应能量本征值，能级分化就是量子化的来源。
        model: 线性使得整个理论的结构与线性代数一一对应：状态是向量，观测量是算子，测量是投影。
        exit: 能说出为什么量子力学可以完全用线性代数表述。
        video:
          q: [量子力学 薛定谔方程 本征态 能级]
          c: [icourse163, ocw-804]

      - id: uni-qua-03
        title: 测量与不确定
        grade: 大三
        core: true
        strand: scale
        kid: 一测量，混合的状态就塌缩成一个结果。
        principle: >
          测量不是被动读取，它会改变状态。两个不对易的可观测量不能同时有确定值，
          这就是不确定性关系的一般形式。
        model: 观测会干扰被观测对象。这在宏观世界表现为“任何测量都有代价”。
        exit: 能说明为什么测得越准的代价是“另一个量变得更不准”。
        video:
          q: [量子力学 测量 塌缩 对易关系 不确定性]
          c: [icourse163, ocw-804]

      - id: uni-qua-04
        title: 自旋与纠缠
        grade: 大三
        core: true
        strand: structure
        kid: 两个粒子一旦配成对，无论隔多远，测一个就能立刻知道另一个。
        principle: >
          纠缠态不能写成两个子系统状态的乘积。它不传递信息，
          但关联强于任何经典机制所能给出的——贝尔不等式的实验否定了定域实在论。
        model: “整体不是部分的简单相加”最干净的反例。系统层面的信息不在任何单个部分里。
        exit: 能说明为什么纠缠不能用来超光速通信。
        video:
          q: [量子力学 自旋 纠缠 贝尔不等式]
          c: [icourse163, ocw-804]

  # ================================================================ 热力学与统计物理
  - subject_id: thermo
    why: >
      统计物理回答的是“微观规则怎样涌出宏观定律”。
      它是理解“个体随机、群体确定”这一结构性事实的正规训练。

    points:
      - id: uni-the-01
        title: 熵的微观解释
        grade: 大三
        core: true
        strand: energy
        kid: 乱的排法数量比整齐的排法多得多，所以东西自己会走向乱。
        principle: >
          熵是微观状态数的对数。系统自发走向微观状态数最多的宏观状态，
          因为那是概率最大的状态。熵不是“混乱”，是“可实现方式的数量”。
        model: 用计数解释必然性：宏观规律是大量可能性上的统计事实，不是个体层面的强制。
        exit: 能用一个简单的计数例子说明为什么整齐的状态概率极低。
        video:
          q: [热力学统计物理 熵 微观状态数 玻尔兹曼]
          c: [icourse163, mit-ocw]

      - id: uni-the-02
        title: 玻尔兹曼分布
        grade: 大三
        core: true
        strand: energy
        kid: 能量高的状态也能出现，只是更少见，能量越高越少见。
        principle: >
          处于能量为 E 的状态的概率与 e 的负 E 比 kT 次方成正比。
          温度决定这个指数衰减有多陡：温度越高，高能状态越常见。
        model: 指数型的概率分布来自“最大化可能性”这一个要求。软最大化与它同源。
        exit: 能说明温度趋近于零与趋近于无穷时分布各会变成什么样。
        video:
          q: [统计物理 玻尔兹曼分布 配分函数]
          c: [icourse163, mit-ocw]

      - id: uni-the-03
        title: 相变与临界现象
        grade: 大三
        core: false
        strand: scale
        kid: 水到了零度会突然变成冰，中间没有过渡状态。
        principle: >
          相变是参量连续变化引起状态不连续改变。临界点附近的系统具有尺度不变性，
          因此不同材料表现出相同的临界指数——这叫普适性。
        model: 微观细节在临界点附近失效，只有对称性与维度起作用。这是“忽略细节仍能成立”的最强例子。
        exit: 能举出一个相变例子并说明“临界点附近细节不重要”表现在哪。
        video:
          q: [统计物理 相变 临界现象 普适性]
          c: [icourse163, mit-ocw, phet]

  # ================================================================ 计算与编程
  - subject_id: computing
    why: >
      编程是“把想法变成可以被机械执行的东西”。它与数学的区别在于必须落地，
      与工程的区别在于可以随便试。这使它成为最好的思维训练场。

    points:
      - id: uni-com-01
        title: 程序就是数据加变换
        grade: 大一
        core: true
        strand: structure
        kid: 程序就是：把东西整理成一种格式，然后一步步换掉它。
        principle: >
          所有程序都可以理解为“定义数据表示 + 定义变换 + 组合变换”。
          提前设计表示，比提前优化代码收益大得多。
        model: 建模就是选表示。表示选错，后面所有努力都在修补这个错误。
        exit: 能说出自己写的一个程序里数据结构是什么、核心变换是哪几个。
        video:
          q: [编程入门 数据结构 函数 抽象, learn to code basics]
          c: [khan-computing, icourse163]

      - id: uni-com-02
        title: 版本控制与可复现实验
        grade: 大一
        core: true
        strand: cause
        kid: 每次改完都拍一张照，以后能翻回任何一张。别人也能照着你说的步骤重做一遍。
        principle: >
          可复现意味着别人拿到代码、环境、数据、命令与随机种子，能得出同方向的结果。
          不能复现的结果只能算观察，不能算证据。
        model: 这是本组织全部工程约定的最小版本：没有可复现依据的主张不成立。
        exit: 能在另一台机器上照着文档跑出同方向的结论，并说出两次运行的差异在哪。
        video:
          q: [git 入门 版本控制 复现性, reproducible research practices]
          c: [khan-computing]

      - id: uni-com-03
        title: 机器学习最小闭环
        grade: 大三
        core: true
        strand: change
        kid: 给机器很多例子，让它自己调参数，调到最后犯的错最小。
        principle: >
          学习等于“定义损失 + 求梯度 + 沿负梯度方向改参数”三件事的反复。
          训练误差小不代表有用：能泛化才是目标，所以在没见过数据上的表现才是判据。
        model: 世界模型与一切学习系统的公共骨架。勘境的全部工作都建在这条闭环上。
        exit: 能写出一段最小训练循环，并说明为什么必须留出验证集。
        video:
          q: [机器学习 入门 损失函数 梯度下降 泛化, machine learning basics]
          c: [icourse163, khan-computing]

      - id: uni-com-04
        title: 数值稳定性
        grade: 大三
        core: true
        strand: number
        kid: 一步一步算的时候，前面的一点点小错会被后面放大成很大的错。
        principle: >
          有些算法对输入的一点点扰动极其敏感（病态），有些则稳定。
          判断标准是条件数：输入相对变化放大多少倍到输出。
        model: 长期预测为何必然发散，答案在这里而不在“模型不够大”。
        exit: 能说明为什么迭代很多步的系统一定会累积误差，并能举出一个放大机制。
        video:
          q: [数值分析 条件数 数值稳定性 误差放大]
          c: [icourse163, khan-computing]

      - id: uni-com-05
        title: 从代码到证据
        grade: 大三
        core: true
        strand: cause
        kid: 跑出好看的数不等于发现规律，要能证明不是因为巧合。
        principle: >
          一个结论要被接受，需要对照、可失败的检验与随机的重复。
          能失败的检验才有信息量：永远不会失败的检查等于没检查。
        model: 这条是本组织文件里重复次数最多的一句。缺了它，全部实验都无法解释。
        exit: 能给自己刚做的实验补上一条对照组，并说出如果结论是错的，这条对照会怎样显示出来。
        video:
          q: [实验设计 对照组 消融实验 可失败检验]
          c: [icourse163]

  # ================================================================ 信息与系统
  - subject_id: information
    why: >
      信息论只回答一件事：什么叫做“知道了”。它把“不确定减少了多少”变成了可计算的量，
      于是“学习”“预测”“惊讶”都有了数值。

    points:
      - id: uni-inf-01
        title: 信息量与比特
        grade: 大三
        core: true
        strand: number
        kid: 一件事越难猜，它发生了告诉你的东西就越多。
        principle: >
          信息量随概率减小而增大，且独立事件的信息量相加。
          满足这两条的函数只有对数形式，所以信息量以 log 的倒数计。
        model: “惊讶程度”可以被量化，这是学习理论中损失函数设计的来源之一。
        exit: 能算出一个事件的信息量，并说明为什么必然事件的信息量为零。
        video:
          q: [信息论 信息量 比特 熵, information theory intuition]
          c: [icourse163, khan-computing]

      - id: uni-inf-02
        title: 熵与压缩极限
        grade: 大三
        core: true
        strand: scale
        kid: 内容越有规律，能压得越小；完全随机的数据一个字都压不掉。
        principle: >
          熵是平均信息量，它给出无损压缩的下限。这个下限无法突破，
          因为压缩本质上就是利用规律性。
        model: “能压多小”是衡量数据里有多少结构的直接指标。它同时告诉我们生成有多少自由度。
        exit: 能说明为什么纯随机数据无法被压缩，以及为什么压缩率可以看作复杂度的度量。
        video:
          q: [信息论 熵 信源编码 压缩极限]
          c: [icourse163, khan-computing]

      - id: uni-inf-03
        title: 反馈与控制
        grade: 大三
        core: true
        strand: system
        kid: 走路时眼睛一直看着偏了多少，偏了就修正，所以不会摔。
        principle: >
          开环控制按预先计划走，闭环控制根据实际偏差修正。
          反馈带来稳定，但延迟过大会产生振荡甚至失控——增益不能无限加大。
        model: 世界模型在规划中的角色就是“提前试算”，而闭环纠错是落地的必备部分。
        exit: 能说出一个反馈系统在什么条件下会振荡，并说明延迟起了什么作用。
        video:
          q: [控制论 反馈 闭环 稳定性 振荡, control theory feedback]
          c: [icourse163]

      - id: uni-inf-04
        title: 噪声与信噪比
        grade: 大三
        core: false
        strand: number
        kid: 信号弱、杂音大的时候，喊得再大声也没用，要把杂音压下去。
        principle: >
          可检出的最小变化受噪声水平限制。提高信噪比的办法是平均多次
          （噪声按根号 N 下降，信号线性累积）或改善测量条件。
        model: 任何测量的分辨率都由噪声决定。报告结论必须同时报告噪声水平。
        exit: 能算出把噪声降低一半需要多少倍的数据量。
        video:
          q: [信号处理 信噪比 噪声 平均降噪]
          c: [icourse163]

  # ================================================================ 数学方法
  - subject_id: methods
    why: >
      这一组是把数学“当工具用”的通用语言。它们的共同点是：换一个域，
      难问题变简单问题。

    points:
      - id: uni-met-01
        title: 傅里叶变换
        grade: 大二
        core: true
        strand: change
        kid: 任何一段波形都能拆成很多不同快慢的波，加起来正好是它。
        principle: >
          傅里叶变换把信号从“随时间的形状”换成“各频率的强度”。
          卷积在时域难算，在频域是逐点相乘——同一件事在另一个域里变简单了。
        model: 换基改变问题难度。这条经验在表示学习里同样成立，而且是其核心动机。
        exit: 能说明卷积定理为什么让计算变简单，并解释“高频”对应图像里的什么。
        video:
          q: [傅里叶变换 频域 卷积定理, Fourier transform intuition]
          c: [icourse163, 3b1b]

      - id: uni-met-02
        title: 复变函数与解析性
        grade: 大二
        core: false
        strand: structure
        kid: 用带方向的数算题，很多看起来无关的公式会突然变成同一件事。
        principle: >
          解析函数由局部信息决定整体（柯西积分公式），这比实函数强得多。
          留数定理把复杂的实积分换成数几个点。
        model: “局部决定整体”是很强的附加结构。给系统加结构性约束，常常让问题变得可解。
        exit: 能说明为什么解析函数比一般光滑函数“更受约束”。
        video:
          q: [复变函数 解析函数 留数定理]
          c: [icourse163]

      - id: uni-met-03
        title: 优化
        grade: 大三
        core: true
        strand: scale
        kid: 在一个有坡度的地方找最低点，一直朝下坡走就会到。
        principle: >
          凸问题的局部最优就是全局最优；非凸问题则没有这个保证。
          学习率决定步长：太大跳过谷底振荡，太小走不到。
        model: 训练世界模型就是解一个非凸优化问题。知道它的失败模式，比知道成功案例重要。
        exit: 能解释为什么学习率太大会发散，并说明凸与非凸的区别在实践上意味着什么。
        video:
          q: [优化理论 梯度下降 凸优化 学习率, gradient descent optimization]
          c: [icourse163, 3b1b]

      - id: uni-met-04
        title: 变分法与泛函
        grade: 大三
        core: false
        strand: change
        kid: 不是问“哪个数最小”，而是问“哪条曲线最好”。
        principle: >
          泛函把函数映到数，变分法求泛函的极值。
          它给出物理学里的最小作用量原理，也给出机器学习里的变分推断。
        model: 把优化对象从点扩展到函数，是把方法一般化的标准操作。
        exit: 能说明“对函数求极值”与“对点求极值”在方法上的异同。
        video:
          q: [变分法 泛函 欧拉方程 变分推断]
          c: [icourse163, mit-ocw]
