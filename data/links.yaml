# 外部资源登记表（唯一事实来源）
#
# 规则（由 scripts/check_links.py 强制执行，不靠自觉）：
#   1. 这里只放**平台级或课程级**地址，不放具体某一条视频的地址。
#      "某个 UP 主的某一集"会在半年内下架或改名，写进教材就是把读者指向死链。
#   2. 每个知识点的**具体视频**用检索式链接承载，见 video.q 字段。
#      检索链接由关键词拼出，永不失效，且平台自己会把最新的好内容排到前面。
#   3. 每条链接都要过 HTTP 检查，结果写进 docs/LINKS.md，带检查时间与状态码。
#      本机网络到不了 ≠ 链接已死，两种情形在报告里必须分开写，否则读者会被误导。
#
# status 取值：
#   verified   —— 本机实测有响应（2xx/3xx）
#   redirected —— 有响应但跳到别处，需人工确认目标仍是对的
#   unreachable—— 本机网络到不了（超时/被拒/被 WAF 挡）。这**不是**链接失效的证据
#   dead       —— 明确 404/410。这条必须修，CI 会失败

links:
  - key: smartedu
    title: 国家中小学智慧教育平台
    url: https://basic.smartedu.cn/
    platform: 教育部
    lang: zh
    what: 小学到高中全部学科的官方微课、教材与习题，免费。中国 K-12 阶段的第一优先入口。
    use_for: [primary, middle, high]

  - key: khan-zh
    title: 可汗学院（中文）
    url: https://zh.khanacademy.org/
    platform: Khan Academy
    lang: zh
    what: 中文界面的可汗学院，数学主线从数数到微积分连续不断。
    use_for: [primary, middle, high, university]

  - key: khan-math
    title: Khan Academy · Math
    url: https://www.khanacademy.org/math
    platform: Khan Academy
    lang: en
    what: 数学课程按学段与主题完整编排，练习带即时反馈，是“知识点—练习—检验”闭环最省力的地方。
    use_for: [primary, middle, high, university]

  - key: khan-science
    title: Khan Academy · Science
    url: https://www.khanacademy.org/science
    platform: Khan Academy
    lang: en
    what: 物理、化学、生物、宇宙学的中英对照讲义。
    use_for: [middle, high, university]

  - key: khan-computing
    title: Khan Academy · Computing
    url: https://www.khanacademy.org/computing
    platform: Khan Academy
    lang: en
    what: 算法、信息论、密码学的入门讲义，大学计算类知识点的补充入口。
    use_for: [university]

  - key: phet
    title: PhET 互动仿真实验（中文）
    url: https://phet.colorado.edu/zh_CN/
    platform: University of Colorado Boulder
    lang: zh
    what: 可直接拖动的物理、化学、数学仿真。看不见的量（电场、概率、能量）能在这里被看见，是“直觉先于公式”的关键工具。
    use_for: [primary, middle, high, university]

  - key: mit-ocw
    title: MIT OpenCourseWare
    url: https://ocw.mit.edu/
    platform: MIT
    lang: en
    what: 麻省理工全部公开课程，含讲义、作业与答案。大学阶段自学最完整的免费来源。
    use_for: [university]

  - key: ocw-1801
    title: MIT 18.01 · Single Variable Calculus
    url: https://ocw.mit.edu/courses/18-01sc-single-variable-calculus-fall-2010/
    platform: MIT OCW
    lang: en
    what: 单变量微积分，含视频、习题与考试。配合中文教材使用。
    use_for: [university]

  - key: ocw-1806
    title: MIT 18.06 · Linear Algebra
    url: https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/
    platform: MIT OCW
    lang: en
    what: 线性代数，讲解顺序从向量空间出发而不是从行列式出发，适合建立几何直觉。
    use_for: [university]

  - key: ocw-804
    title: MIT 8.04 · Quantum Physics I
    url: https://ocw.mit.edu/courses/8-04-quantum-physics-i-spring-2016/
    platform: MIT OCW
    lang: en
    what: 量子力学第一门课，先建立波函数与概率幅的语言。
    use_for: [university]

  - key: icourse163
    title: 中国大学MOOC
    url: https://www.icourse163.org/
    platform: 高教社 / 网易
    lang: zh
    what: 国内高校课程的慕课平台，中文讲授的大学基础课来源。选课时看开课学校与是否有作业批改。
    use_for: [university]

  - key: openstax
    title: OpenStax · 免费大学教材
    url: https://openstax.org/
    platform: Rice University
    lang: en
    what: 经同行评审的免费教材（物理、微积分、统计、生物、经济）。有 PDF 可下载，引用页码稳定。
    use_for: [middle, high, university]

  - key: 3b1b
    title: 3Blue1Brown（英文站）
    url: https://www.3blue1brown.com/
    platform: 3Blue1Brown
    lang: en
    what: 用动画讲线性代数、微积分、概率与神经网络的直觉。价值在“先看见形状，再写公式”。
    use_for: [high, university]

  - key: desmos
    title: Desmos 图形计算器
    url: https://www.desmos.com/calculator
    platform: Desmos
    lang: zh
    what: 把函数画出来再改参数，观察图像怎么变。理解“参数决定形状”的最快工具。
    use_for: [middle, high, university]

  - key: wolframalpha
    title: Wolfram Alpha
    url: https://www.wolframalpha.com/
    platform: Wolfram Research
    lang: en
    what: 算积分、解方程、查常数。定位是**校验自己的手算**，不是替代手算；先自己算，再让它检查。
    use_for: [high, university]

  - key: oeis
    title: OEIS · 整数数列在线百科
    url: https://oeis.org/
    platform: OEIS Foundation
    lang: en
    what: 输入一串数，看它是不是已知数列、有没有公式与文献。培养“先查再猜”的习惯。
    use_for: [high, university]

  - key: nist-constants
    title: NIST 物理常数表
    url: https://physics.nist.gov/cuu/Constants/
    platform: NIST
    lang: en
    what: 光速、普朗克常数等的官方值与不确定度。写数字要带来源时用这里，不用记忆。
    use_for: [high, university]

  - key: feynman
    title: 费曼物理学讲义（在线全文）
    url: https://www.feynmanlectures.caltech.edu/
    platform: Caltech
    lang: en
    what: 物理直觉的经典来源。第 1 卷前几章可以完全不懂微积分就读。
    use_for: [high, university]

  - key: zdic
    title: 汉典
    url: https://www.zdic.net/
    platform: 汉典
    lang: zh
    what: 查单字的字形演变、本义、古音与用例。中文学习的“元素周期表”入口。
    use_for: [primary, middle, high, language]

  - key: gushiwen
    title: 古诗文网
    url: https://www.gushiwen.cn/
    platform: 古诗文网
    lang: zh
    what: 古诗文原文、注释、译文与赏析，按朝代与作者可检索。
    use_for: [middle, high, language]

  - key: moe-curriculum
    title: 教育部 · 义务教育课程方案和课程标准
    url: http://www.moe.gov.cn/srcsite/A26/s8001/
    platform: 教育部
    lang: zh
    what: 各科课程标准的官方发布页。“该学什么、学到什么程度”的最终依据，本仓库的覆盖范围以此对齐。
    use_for: [primary, middle]

  - key: arxiv
    title: arXiv
    url: https://arxiv.org/
    platform: Cornell University
    lang: en
    what: 论文预印本。注意预印本未经同行评审，引用时要写明这是预印本。
    use_for: [university]

  - key: link-check-selftest
    title: 自查条目（故意指向不存在的仓库）
    url: https://api.github.com/repos/kineworld/kine-learn-selftest-xyz
    platform: none
    lang: en
    what: 这条链接**应该**返回 404。它的唯一用途是证明 check_links.py 真能识别失效链接。
    use_for: [meta]
    expect: dead
    note: >
      没有这条自查，链接检查器可能对任何输入都返回"通过"而没人发现——
      一个永远通过的检查比没有检查更糟。它顺带记录了一个实测教训：
      最初用的是 example.invalid，返回的是"本机到不了"而不是 404，
      于是它什么也没验到。判据写成 expect 后，分类器坏掉会让 CI 直接红。

# ---------------------------------------------------------------- 检索入口模板
#
# 这些不是"链接"，是函数：给一个关键词，返回一个永远有效的检索页面。
# 知识点的具体视频全部走这里，见 curriculum/**.yaml 的 video.q 字段。
search_templates:
  - key: bilibili
    title: 哔哩哔哩检索
    template: https://search.bilibili.com/all?keyword={q}
    lang: zh
    note: 中文讲解密度最高的平台。加“微课”“板书”“推导”等词能显著提高命中率。

  - key: youtube
    title: YouTube 检索
    template: https://www.youtube.com/results?search_query={q}
    lang: en
    note: 英文资源量最大的一侧。大学阶段英文术语检索比中文更容易找到完整课程。

  - key: smartedu-search
    title: 国家中小学智慧教育平台检索
    template: https://basic.smartedu.cn/search?keyword={q}
    lang: zh
    note: 对应教材版本的官方微课，小学到高中首选。

  - key: ocw-search
    title: MIT OCW 课程检索
    template: https://ocw.mit.edu/search/?q={q}
    lang: en
    note: 找完整大学课程，而不是零散视频。
