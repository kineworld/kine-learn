    lang: en
    kind: tool
    points: [uni-cal-03, uni-lin-04]
    what: 纯 Python 的符号计算库，能求导、积分、解方程、求特征值。
    how: 定位是**校验你的手算**。先自己算，再让它检查，不要反过来。
    caution: 求不出的积分它也会求不出；结果是表达式，需要自己判断是否化简到位。

  - repo: numpy/numpy
    title: NumPy
    lang: en
    kind: tool
    points: [uni-lin-02, uni-com-04]
