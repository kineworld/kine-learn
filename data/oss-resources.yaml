    caution: 广播规则与浮点误差是两个高频踩坑点，文档要读细。

  - repo: scipy/scipy
    title: SciPy
    lang: en
    kind: tool
    points: [uni-met-03, uni-com-04]
    what: 建立在 NumPy 上的科学计算算法库：优化、积分、插值、信号处理。
    how: 学优化时用它验证自己写的梯度下降是否收敛到同一个点。
    caution: 它是算法库，不解释原理。不看文档直接用会得到看不懂的结果。

  - repo: matplotlib/matplotlib
    title: Matplotlib
    lang: en
    kind: tool
    points: [uni-com-04]
    what: Python 的绘图库。
    how: 每个数值实验都先画图再下结论。画图是最便宜的错误检查。
    caution: 默认样式不适合出版，配色与字号需要手动调整。

  - repo: jupyter/notebook
    title: Jupyter Notebook
    lang: en
    kind: tool
    points: [uni-com-02]
    what: 交互式笔记本环境，代码、结果与解释放在同一个文档里。
    how: 用它写实验记录：一步代码、一个结果、一句结论。这就是可复现实验的最小形式。
    caution: 执行顺序与保存状态容易不一致，重跑一遍才发现结果对不上是常态。用“全部重跑”校验。

  - repo: scikit-learn/scikit-learn
    title: scikit-learn
    lang: en
    kind: tool
    points: [uni-com-03, uni-pro-06]
    what: 经典机器学习算法的标准实现库。
    how: 用它对比不同模型在同一数据上的表现，训练集与测试集必须自己分好。
    caution: 默认参数会给出看起来不错的分数，交叉验证不做就不知道真假。

  - repo: pytorch/pytorch
    title: PyTorch
    lang: en
    kind: tool
    points: [uni-cal-05, uni-com-03]
    what: 主流深度学习框架，自动求梯度。
    how: 用它验证链式法则：自己手推梯度，再和 autograd 的结果比。
    caution: 显存、随机种子、设备不一致会给出难以复现的结果。实验前先把这三样固定。

