# 开源资源索引（唯一事实来源）
#
# 为什么这个文件里**没有星数和许可证**：那些数字必须由 scripts/fetch_oss.py 从
# GitHub API 现拉，写进 data/oss-verified.json。手打的数字会在几周后骗人，
# 而骗人的数字比没有数字更糟（本组织 CONTRIBUTING.md 第 1 条）。
#
# 每条要写清楚：
#   repo     仓库全名。大小写以 API 返回的 full_name 为准，validate.py 会比对并报错。
#   title    中文名，便于阅读。
#   lang     zh / en / multi
#   kind     tutorial 教程 | textbook 教材 | simulation 仿真 | dataset 数据 |
#            tool 工具 | course_list 课程索引 | practice 练习
#   points   它能支撑本仓库哪些知识点的 id。build.py 用它生成"知识点 → 资源"反查表。
#   what     一句话它到底是什么（不是它的宣传语）。
#   how      怎么用，要具体到"从哪一节开始、配合哪个知识点"。
#   caution  限制与风险。没有风险的条目通常是因为没认真看。
#
# 收录标准（三条都满足才收）：
#   1. 能用 GitHub API 查到、不是空壳（有实际内容体量）。
#   2. 与本仓库某个知识点的出口标准直接对应，能替代或补足它。
#   3. 能说清它的限制：时效、许可证、语言、是否归档。

resources:
  # ---------------------------------------------------------------- 自学路径骨架
  - repo: ossu/math
    title: OSSU 数学自学路径
    lang: en
    kind: course_list
    points: [uni-cal-01, uni-lin-01, uni-pro-01]
    what: 一条按依赖关系排好的大学数学自学路线：从逻辑与证明开始，到线性代数、微积分、概率、微分方程。
    how: 用它解决“我该按什么顺序学”的问题，而不是解决“这个定义是什么”。读它的课程顺序，教材换成本仓库对应的中文入口。
    caution: 它只给顺序与课程链接，不给答案与反馈。没有作业批改的自学路线，通过率低，必须自己找人互查。

  - repo: ossu/computer-science
    title: OSSU 计算机科学自学路径
    lang: en
    kind: course_list
    points: [uni-dis-01, uni-com-01, uni-dis-03]
    what: 计算机本科的核心课程顺序表，含每门课的免费教材与作业。
    how: 当索引看。国内学生优先换成 QSCTech/zju-icicles 或 PKUanonym/REKCARC-TSC-UHT 里对应的课程材料。
    caution: 课程链接是逐年累积的，早期链接可能失效。以它给的课程名去搜最新版本更稳。

  - repo: ossu/data-science
    title: OSSU 数据科学自学路径
    lang: en
    kind: course_list
    points: [uni-pro-01, uni-com-03]
    what: 数据科学的自学课程顺序，偏统计与编程的组合。
    how: 在大学段概率与统计学完后当作应用路线的补充。
    caution: 最后更新时间较旧，工具类内容（框架、库）已部分过时，方法论部分仍然有效。

  - repo: rossant/awesome-math
    title: 数学资源索引
    lang: en
    kind: course_list
    points: [uni-cal-03, uni-met-01]
    what: 按主题分类的数学学习资源清单（教材、讲义、视频、工具）。
    how: 遇到本仓库没展开的主题（拓扑、数论、代数几何）时，用它找入口。
    caution: 是清单不是课程，不保证质量一致。挑资源时优先看有没有配套习题与答案。

  # ---------------------------------------------------------------- 仿真实验（PhET）
  - repo: phetsims/states-of-matter
    title: PhET 物质三态
    lang: zh
    kind: simulation
    points: [pri-sci-02, mid-che-01]
    what: 可拖动粒子、加热降温的交互仿真，直接看三态变化时粒子在做什么。
    how: 先玩十分钟，再读知识点正文。小孩子看不懂文字，看懂这个就能记住结论。
    caution: 仿真是示意模型，粒子的画法与真实分子形状无关。别把示意图当结构式。

  - repo: phetsims/build-an-atom
    title: PhET 原子构建器
    lang: zh
    kind: simulation
    points: [mid-che-01, mid-che-02, hi-che-01]
    what: 往原子里加质子、中子、电子，看元素种类、电荷与质量怎么变。
    how: 加质子看到元素变了，加中子看到同位素，减电子变成离子。三个操作对应三个概念。
    caution: 不展示电子云形状，无法替代量子力学的原子模型。

  - repo: phetsims/circuit-construction-kit-dc
    title: PhET 直流电路搭建
    lang: zh
    kind: simulation
    points: [mid-phy-07, mid-phy-08]
    what: 拖电池、电阻、导线搭电路，实时看电流与电压。
    how: 先搭一个串联，再改成并联，比较亮度的差别。欧姆定律的两道公式就落在这里。
    caution: 理想导线与理想电池不会发热，与真实电路有差别。

  - repo: phetsims/projectile-motion
    title: PhET 抛体运动
    lang: zh
    kind: simulation
    points: [hi-phy-01, hi-phy-02]
    what: 可调角度、初速度与质量的抛体实验，同时显示轨迹与速度分量。
    how: 固定初速度，只改角度，找出射程最大的角度——这是把函数极值用起来的最快方式。
    caution: 默认无空气阻力，真实飞行要考虑阻力后最优角不再是 45 度。

  - repo: phetsims/energy-skate-park
    title: PhET 能量滑板场
    lang: zh
    kind: simulation
    points: [mid-phy-05, hi-phy-04]
    what: 滑板上上下下，同时显示动能与势能的柱状图。
    how: 开着能量柱看一遍全程，能量的“总量不变、形式互换”就再也忘不掉了。
    caution: 默认无摩擦。打开摩擦后才能看到能量“消失”的部分去了热。

  - repo: phetsims/gravity-and-orbits
    title: PhET 引力与轨道
    lang: zh
    kind: simulation
    points: [hi-phy-05, uni-phy-01]
    what: 调整质量与初速度，看轨道变成圆、椭圆或直接飞走。
    how: 只改初速度不改变其它量，找到圆轨道与逃逸的两个临界值。
    caution: 只处理两体问题。三体以上的行为无法用它直觉化。

  - repo: phetsims/wave-interference
    title: PhET 波的干涉
    lang: zh
    kind: simulation
    points: [hi-phy-08, uni-phy-06]
    what: 两个波源同时发波，实时光场显示干涉条纹。
    how: 改频率与间距，观察条纹间距变化，这是“用条纹数长度”的直观来源。
    caution: 水波与光波只是数学同构，不能据此认为光需要介质。

  - repo: phetsims/masses-and-springs
    title: PhET 质量与弹簧
    lang: zh
    kind: simulation
    points: [uni-phy-03]
    what: 弹簧振子仿真，显示周期与振幅、质量、劲度系数的关系。
    how: 改变振幅，确认周期不变——这是简谐振动最反直觉也最核心的一条。
    caution: 只模拟理想弹簧，不涉及阻尼与非线性。

  - repo: phetsims/geometric-optics
    title: PhET 几何光学
    lang: zh
    kind: simulation
    points: [mid-phy-06, uni-phy-06]
    what: 透镜与反射镜成像仿真，物距改变时成像位置与大小实时变化。
    how: 拖动物体穿过焦点，看实像何时变成虚像。
    caution: 几何光学不含波长效应，干涉衍射要换 wave-interference。

  - repo: phetsims/color-vision
    title: PhET 颜色视觉
    lang: zh
    kind: simulation
    points: [pri-sci-04]
    what: 单色光混合与滤光的交互演示。
    how: 小学阶段用它说明“看到的颜色是光与眼睛共同的结果”，不必讲波长。
    caution: 显示器的颜色不等于真实光谱，只作定性演示。

  # ---------------------------------------------------------------- 数学习题与图形
  - repo: geogebra/geogebra
    title: GeoGebra 数学软件
    lang: zh
    kind: tool
    points: [mid-math-05, mid-math-06, hi-math-03, hi-math-06]
    what: 几何作图与函数绘图的数学软件，改动参数图像立即跟着变。
    how: 每学一个函数都画一遍再改参数。理解“参数决定形状”比背性质表快得多。
    caution: 仓库是官方镜像，日常使用建议直接访问官网在线版。没有图形计算器时会很依赖它。

  - repo: OpenLogicProject/OpenLogic
    title: 开源逻辑学教材
    lang: en
    kind: textbook
    points: [mid-civ-03, hi-chn-03, uni-dis-01]
    what: 一本可自由改编的中级逻辑教材，覆盖命题逻辑、一阶逻辑、可靠性与完全性。
    how: 只读前三章就够用：形式化、真值表、有效性。之后遇到“这个论证对不对”就有工具了。
    caution: 英文。习题无官方答案册，需要自己找人核对。

  # ---------------------------------------------------------------- 统计与大学教材
  - repo: OpenIntroStat/openintro-statistics
    title: OpenIntro 统计学教材
    lang: en
    kind: textbook
    points: [mid-math-10, hi-math-08, uni-pro-05, uni-pro-06]
    what: 大学入门统计的开源教材，配套数据与 R 代码。
    how: 直接读置信区间与假设检验两章，用它的数据自己算一遍，比读定义记得住。
    caution: 代码示例以 R 为主。书中的例子是英文语境下的数据集。

  - repo: openstax/osbooks-prealgebra-bundle
    title: OpenStax 预备代数（初中代数）
    lang: en
    kind: textbook
    points: [mid-math-01, mid-math-02, mid-math-03]
    what: 初中代数水平的开源教材，含大量分级习题与答案。
    how: 用来补习题量：国内教材例题少，解释多；这本反过来，适合刷。
    caution: 英文，且体系与中国课标不完全对齐（进度与术语都有差别）。

  - repo: openstax/osbooks-college-algebra-bundle
    title: OpenStax 大学代数
    lang: en
    kind: textbook
    points: [hi-math-02, hi-math-04]
    what: 函数、指数对数、数列与级数的大学先修教材。
    how: 与高中函数章节对照读，看同一件事的两种讲法。
    caution: 英文。深度低于数学系的分析课，属于工科预备水平。

  - repo: openstax/osbooks-calculus-bundle
    title: OpenStax 微积分
    lang: en
    kind: textbook
    points: [uni-cal-01, uni-cal-02, uni-cal-04, uni-cal-05]
    what: 三卷本微积分教材，讲义、习题与答案齐全，可免费下载 PDF。
    how: 配合 MIT 18.01 使用：MIT 给讲解，这本给题量与答案。
    caution: 英文。分卷本内容有重叠，选一本用，不要三本都开。

  - repo: openstax/osbooks-physics
    title: OpenStax 大学物理（含高中物理）
    lang: en
    kind: textbook
    points: [hi-phy-01, hi-phy-04, hi-phy-06, uni-phy-01]
    what: 从高中到大学入门的物理教材，覆盖力学、热学、电磁、光学。
    how: 用它补英文术语：中文会了但读英文文献卡住，多数卡在术语而不是概念。
    caution: 英文。数学要求低于理论力学与电动力学的专业课教材。

  - repo: openstax/osbooks-university-physics-bundle
    title: OpenStax 大学物理（三卷本，微积分基础）
    lang: en
    kind: textbook
    points: [uni-phy-01, uni-phy-02, uni-phy-04, uni-phy-05]
    what: 基于微积分的大学物理教材，定位是理工科一年级的普物。
    how: 学完微积分再读，顺序反过来会很痛苦。
    caution: 英文。电磁部分不如专门的《电动力学》深入。

  # ---------------------------------------------------------------- 计算机与算法
  - repo: krahets/hello-algo
    title: Hello 算法
    lang: zh
    kind: tutorial
    points: [uni-dis-03, uni-com-01]
    what: 中文数据结构与算法教程，每个数据结构都配动画图解与可运行代码，支持十多种语言。
    how: 本仓库离散数学与计算单元的主要配套读物。先看动画建立直觉，再自己写一遍。
    caution: 面向面试与入门，不覆盖算法理论的证明部分。仓库体积大，克隆前先看在线版。

  - repo: youngyangyang04/leetcode-master
    title: 代码随想录
    lang: zh
    kind: practice
    points: [uni-dis-03, uni-dis-02]
    what: 按类型组织的刷题顺序与题解，中文，含图示。
    how: 配合 Hello 算法：一个讲结构，一个给题目。按它的顺序刷，不要乱序刷。
    caution: 刷题数量不等于能力。没有复习机制，刷过的题两周后会全忘。

  - repo: practical-tutorials/project-based-learning
    title: 基于项目的学习清单
    lang: en
    kind: course_list
    points: [uni-com-01]
    what: 按语言与方向分类的“动手做出一个东西”的教程清单。
    how: 学完基础语法后，从这里挑一个项目做完。只看不做等于没学。
    caution: 清单质量参差，部分链接失效。选之前确认最后更新时间。

  - repo: codecrafters-io/build-your-own-x
    title: 从零重造技术
    lang: en
    kind: course_list
    points: [uni-com-01, uni-dis-04]
    what: 教你从零实现数据库、解释器、操作系统、神经网络等系统的教程清单。
    how: 想真正理解“一个系统内部怎么运作”时用它。挑一个与你当前方向相关的做完。
    caution: 难度差异极大。从最简单的（如写一个 JSON 解析器）开始，不要一上来做操作系统。

  - repo: donnemartin/system-design-primer
    title: 系统设计入门
    lang: en
    kind: tutorial
    points: [uni-inf-03, uni-inf-04]
    what: 大规模系统的设计基础：缓存、一致性、可用性、消息队列。
    how: 在本仓库的信息与系统单元之后读，把反馈、噪声、可靠性的概念落到真实架构上。
    caution: 面向面试场景，部分方案偏工程惯例而非第一性原理解释。

  - repo: nilbuild/developer-roadmap
    title: 开发者路线图
    lang: en
    kind: course_list
    points: [uni-com-01]
    what: 各方向的技能地图，标注了依赖关系与推荐学习顺序。
    how: 当“我需要学什么”的检查表用，不当学习材料用。
    caution: 罗列的技术面很宽，容易变成收集书签而不是真的学会。

  - repo: microsoft/Web-Dev-For-Beginners
    title: 微软 Web 开发入门（12 周课程）
    lang: multi
    kind: tutorial
    points: [uni-com-01]
    what: 微软出的 12 周前端课程，含项目、测验与多语言翻译版本。
    how: 结构完整、有作业有测验，是“有人替你把关进度”的少数免费课程之一。
    caution: 多语言版本由社区翻译，可能落后于英文原版。

  - repo: microsoft/ML-For-Beginners
    title: 微软机器学习入门（12 周，26 课）
    lang: multi
    kind: tutorial
    points: [uni-com-03, uni-pro-03]
    what: 经典机器学习课程，用 scikit-learn，含测验与项目。
    how: 大学段“机器学习最小闭环”的主要配套课程。先跑通它的第一个实验再谈别的。
    caution: 偏经典机器学习，不覆盖深度学习与大模型。含测验答案，容易被用来“抄作业”。

  - repo: microsoft/AI-For-Beginners
    title: 微软 AI 入门（12 周，24 课）
    lang: multi
    kind: tutorial
    points: [uni-com-03]
    what: 人工智能概念课，含搜索、知识表示、神经网络、伦理。
    how: 比 ML-For-Beginners 更偏概念，适合先建立全局观再学具体算法。
    caution: 概念密度高但推导少，不能替代数学基础。

  - repo: microsoft/Data-Science-For-Beginners
    title: 微软数据科学入门（10 周，20 课）
    lang: multi
    kind: tutorial
    points: [uni-pro-05, uni-com-03]
    what: 数据科学全流程课程：取数、清洗、可视化、建模、部署。
    how: 用来学“从一份脏数据到一个可信结论”的完整流程，这部分数学课不会教。
    caution: 工具版本更新快，演练代码可能需要调整依赖版本。

  - repo: microsoft/generative-ai-for-beginners
    title: 微软生成式 AI 入门（21 课）
    lang: multi
    kind: tutorial
    points: [uni-com-03]
    what: 生成式 AI 应用开发课程，含提示工程与实践项目。
    how: 只在本仓库大学段基础过完之后进入。跳过数学直接学提示工程，会停在“会用不会判断”。
    caution: 依赖外部模型服务，部分课程需要密钥与额度。

  - repo: huggingface/course
    title: Hugging Face 课程
    lang: en
    kind: tutorial
    points: [uni-com-03, uni-met-01]
    what: Transformers 与自然语言处理实操课程，边讲边跑代码。
    how: 需要先有 PyTorch 与线性代数基础，再进来。
    caution: 与特定库的版本强耦合，长期看文档会比课程更新。

  - repo: mlabonne/llm-course
    title: LLM 课程
    lang: en
    kind: course_list
    points: [uni-com-03]
    what: 大语言模型路线的路线图与配套笔记，分基础、科学、工程三部分。
    how: 当索引用，挑“科学”部分扫一遍建立术语表。
    caution: 收录内容更新速度快于维护速度，部分章节已过时。

  - repo: ageron/handson-ml3
    title: 机器学习实战（第三版）
    lang: en
    kind: tutorial
    points: [uni-com-03, uni-com-04]
    what: 一本以可运行 notebook 为主的机器学习教材，从线性回归讲到 Transformer。
    how: 每个 notebook 都跑一遍并改参数，是“最小闭环”最省力的练习路径。
    caution: 需要本地装好科学计算环境；直接读不跑效果大打折扣。

  - repo: d2l-ai/d2l-zh
    title: 动手学深度学习（中文）
    lang: zh
    kind: textbook
    points: [uni-cal-05, uni-lin-01, uni-com-03]
    what: 中文深度学习教材，每个概念配可运行代码，被五百多所大学用于教学。
    how: 中文读者学深度学习的第一选择。数学不熟就一边看一边补微积分与线代。
    caution: 仓库最近一次提交是 2024 年，框架版本已落后。按书里的版本装环境，别用最新的。

  - repo: exacity/deeplearningbook-chinese
    title: 深度学习（花书）中文翻译
    lang: zh
    kind: textbook
    points: [uni-com-03, uni-pro-02]
    what: 《Deep Learning》的中文翻译，覆盖线性代数、概率、优化到生成模型的理论。
    how: 当参考书查，不要当教程顺读。第一部分（数学基础）值得通读。
    caution: 原书 2016 年版，生成模型部分已明显过时。翻译校对问题较多，关键结论对照英文原文。

  - repo: nndl/nndl.github.io
